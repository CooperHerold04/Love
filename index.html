<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Adventure ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

#gameContainer {
    position: relative;
    width: 960px;
    height: 540px;
    overflow: hidden;
    background: #87ceeb;
}

canvas {
    display: block;
    width: 960px;
    height: 540px;
}

/* TITLE SCREEN */

#titleScreen {
    position: absolute;
    inset: 0;

    background: linear-gradient(#87ceeb, #bdefff);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;
}

#titleScreen h1 {
    font-size: 48px;
    margin: 0 0 10px 0;
    color: white;
    text-shadow: 3px 3px #555;
}

#titleScreen p {
    font-size: 22px;
    margin-bottom: 30px;
}

#startButton {
    padding: 15px 30px;
    font-size: 20px;

    border: none;
    border-radius: 12px;

    background: #ff6f91;
    color: white;

    cursor: pointer;

    box-shadow: 0 4px 0 #c94f6e;
}

#startButton:hover {
    background: #ff557e;
}

#startButton:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c94f6e;
}

/* CHAPTER TITLE */

#chapterTitle {
    position: absolute;
    inset: 0;

    background: rgba(0,0,0,.65);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 8;
}

#chapterTitle h2 {
    font-size: 48px;
    margin: 0;
}

#chapterTitle p {
    font-size: 25px;
    margin-top: 10px;
}

/* DIALOGUE */

#dialogueBox {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 880px;

    background: rgba(0,0,0,.82);

    border: 3px solid white;
    border-radius: 12px;

    padding: 18px 22px;

    z-index: 7;
}

#speaker {
    display: block !important;

    font-size: 24px;
    font-weight: bold;

    margin-bottom: 8px;

    color: #ffb6c9;
}

#dialogueText {
    font-size: 19px;
    line-height: 1.4;
    min-height: 55px;
}

#continueText {
    text-align: right;

    font-size: 14px;
    color: #ccc;

    margin-top: 8px;
}

/* CONTROLS */

#controls {
    position: absolute;

    top: 12px;
    left: 12px;

    background: rgba(0,0,0,.45);

    padding: 8px 12px;

    border-radius: 8px;

    font-size: 14px;

    z-index: 5;
}

.hidden {
    display: none !important;
}

</style>
</head>

<body>

<div id="gameContainer">

<canvas id="gameCanvas" width="960" height="540"></canvas>

<div id="titleScreen">

    <h1>Our Little Adventure ❤️</h1>

    <p>A story about us</p>

    <button id="startButton">
        Start Our Story
    </button>

</div>

<div id="chapterTitle" class="hidden">

    <h2 id="chapterTitleText"></h2>

    <p id="chapterSubtitle"></p>

</div>

<div id="controls">

    ← → or A / D to move

</div>

<div id="dialogueBox" class="hidden">

    <div id="speaker"></div>

    <div id="dialogueText"></div>

    <div id="continueText">
        Press SPACE or ENTER
    </div>

</div>

</div>

<script>

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const titleScreen = document.getElementById("titleScreen");
const startButton = document.getElementById("startButton");

const chapterTitle = document.getElementById("chapterTitle");
const chapterTitleText = document.getElementById("chapterTitleText");
const chapterSubtitle = document.getElementById("chapterSubtitle");

const dialogueBox = document.getElementById("dialogueBox");
const speakerElement = document.getElementById("speaker");
const dialogueTextElement = document.getElementById("dialogueText");


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

let currentChapter = 0;

let currentDialogue = 0;

let showingDialogue = false;

let chapterTitleTimer = null;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 120,
    y: 365,

    width: 40,
    height: 60,

    speed: 5

};


const keys = {

    left: false,
    right: false

};


/* =========================================================
   CHAPTERS
========================================================= */

const chapters = {

    firstMeeting: [

        {
            speaker: "Cooper",
            text: "I still remember the first time we met."
        },

        {
            speaker: "Cooper",
            text: "At the time, I had no idea how important that day would become."
        },

        {
            speaker: "Alyssa",
            text: "Neither did I, even if I wanted you to cancel our first date."
        },

        {
            speaker: "Cooper",
            text: "But something about Alyssa immediately felt different."
        },

        {
            speaker: "Alyssa",
            text: "And somehow, we kept talking every single day."
        },

        {
            speaker: "Cooper",
            text: "One conversation became another."
        },

        {
            speaker: "Cooper",
            text: "And before I knew it, I was looking forward to seeing her every day, her smile, her eyes, everything."
        },

        {
            speaker: "Alyssa",
            text: "Things were starting to feel pretty special."
        },

        {
            speaker: "Cooper",
            text: "I didn't know where our story would take us."
        },

        {
            speaker: "Cooper",
            text: "But I knew I wanted to find out."
        },

        {
            speaker: "Cooper",
            text: "And that was only the beginning."
        }

    ],


    girlfriendQuestion: [

        {
            speaker: "Cooper",
            text: "One early morning, I had a little surprise planned."
        },

        {
            speaker: "Cooper",
            text: "I lied about being sick and made my way into Alyssa's backyard with a basket I made."
        },

        {
            speaker: "Cooper",
            text: "I was nervous, but I knew what I wanted to ask."
        },

        {
            speaker: "Cooper",
            text: "Alyssa, would you be please my girlfriend?"
        },

        {
            speaker: "Alyssa",
            text: "Sure."
        },

        {
            speaker: "Cooper",
            text: "And just like that, we officially became us."
        },

        {
            speaker: "Cooper",
            text: "I don't think either of us knew just how much that little question would change our lives."
        },

        {
            speaker: "Cooper",
            text: "But I wouldn't change a thing."
        }

    ],


    pittsburgh: [

        {
            speaker: "Cooper",
            text: "Then came the time when Alyssa had to fly to Pittsburgh to visit Gabrielle"
        },

        {
            speaker: "Cooper",
            text: "Saying goodbye wasn't easy."
        },

        {
            speaker: "Alyssa",
            text: "I didn't want to leave."
        },

        {
            speaker: "Cooper",
            text: "Neither did I want her to go."
        },

        {
            speaker: "Cooper",
            text: "However, being apart made us realize just how much we wanted to be together."
        },

        {
            speaker: "Alyssa",
            text: "We didn't want to keep living so far apart."
        },

        {
            speaker: "Cooper",
            text: "We started talking about what our future could look like."
        },

        {
            speaker: "Cooper",
            text: "And eventually, we made a pretty big decision."
        },

        {
            speaker: "Alyssa",
            text: "We decided to get married."
        },

        {
            speaker: "Cooper",
            text: "It was scary, exciting, and completely worth it."
        },

        {
            speaker: "Cooper",
            text: "Because we knew we wanted to build our life together."
        }

    ],


    wedding: [

        {
            speaker: "Cooper",
            text: "And then came the day we had been waiting for."
        },

        {
            speaker: "Cooper + Alyssa",
            text: "Our wedding."
        },

        {
            speaker: "Cooper",
            text: "It happened right here in the same backyard where I once asked her to be my girlfriend."
        },

        {
            speaker: "Cooper",
            text: "This time, we weren't starting a relationship."
        },

        {
            speaker: "Cooper",
            text: "We were starting our marriage."
        },

        {
            speaker: "Cooper",
            text: "Joyce, Tristan, Ireneo, Carla, Doni, and Alyssa's mom were all there watching through FaceTime."
        },
     {    
            speaker: "Cooper",
            text: "Her mom terrified me but I still pushed through."
     },
        {
            speaker: "Alyssa",
            text: "I can't believe we're actually married."
        },

        {
            speaker: "Cooper",
            text: "Neither can I."
        },

        {
            speaker: "Cooper",
            text: "But I know one thing."
        },

        {
            speaker: "Cooper",
            text: "I want to spend the rest of my life with Alyssa."
        },

        {
            speaker: "Cooper",
            text: "Forever starts here."
        }

    ],


    distance: [

        {
            speaker: "Cooper",
            text: "And now, here we are."
        },

        {
            speaker: "Cooper",
            text: "Even after everything we've been through, sometimes we're still far apart."
        },

        {
            speaker: "Alyssa",
            text: "I miss you."
        },

        {
            speaker: "Cooper",
            text: "I miss you too, love. I wish I could've stayed in the Philippines with you forever"
        },

        {
            speaker: "Cooper",
            text: "I know things are hard right now."
        },

        {
            speaker: "Alyssa",
            text: "Some days are harder than others."
        },

        {
            speaker: "Cooper",
            text: "There are days when I wish I could just reach through this screen and hold you."
        },

        {
            speaker: "Cooper",
            text: "But even when the distance feels impossible, I know you and I are going to get through it."
        },

        {
            speaker: "Alyssa",
            text: "Do you really think we can?"
        },

        {
            speaker: "Cooper",
            text: "I know we can."
        },

        {
            speaker: "Cooper",
            text: "We've already made it through so much."
        },

        {
            speaker: "Cooper",
            text: "This is just another part of our story."
        },

        {
            speaker: "Cooper",
            text: "No matter how hard it gets, I'm not going anywhere."
        },

        {
            speaker: "Cooper",
            text: "We'll get through the distance."
        },

        {
            speaker: "Cooper",
            text: "We'll get through the hard days."
        },

        {
            speaker: "Cooper",
            text: "And one day, we won't have to say goodbye anymore."
        },

        {
            speaker: "Cooper",
            text: "Until then, I'll keep choosing you."
        },

        {
            speaker: "Cooper",
            text: "ILoveYou ❤️"
        }

    ]

};


/* =========================================================
   CHAPTER INFORMATION
========================================================= */

const chapterInfo = [

    {
        name: "The First Meeting",
        subtitle: "Where our story began."
    },

    {
        name: "The Question",
        subtitle: "The day we became us."
    },

    {
        name: "A Little Distance",
        subtitle: "Sometimes being apart makes you realize what matters most."
    },

    {
        name: "Our Wedding",
        subtitle: "The beginning of forever."
    },

    {
        name: "No Matter the Distance",
        subtitle: "Our story isn't finished yet."
    }

];


/* =========================================================
   CURRENT CHAPTER
========================================================= */

function getCurrentChapter() {

    const chapterNames = Object.keys(chapters);

    return chapters[chapterNames[currentChapter]];

}


/* =========================================================
   CHAPTER TITLE
========================================================= */

function showChapterTitle() {

    const info = chapterInfo[currentChapter];

    chapterTitleText.textContent = info.name;

    chapterSubtitle.textContent = info.subtitle;

    chapterTitle.classList.remove("hidden");

    if (chapterTitleTimer) {
        clearTimeout(chapterTitleTimer);
    }

    chapterTitleTimer = setTimeout(() => {

        chapterTitle.classList.add("hidden");

        showDialogue();

    }, 3000);

}


/* =========================================================
   DIALOGUE
========================================================= */

function showDialogue() {

    const chapter = getCurrentChapter();

    if (currentDialogue >= chapter.length) {

        nextChapter();

        return;

    }

    showingDialogue = true;

    const dialogue = chapter[currentDialogue];


    /* FORCE CORRECT NAMES */

    const speakerNames = {

        "Me": "Cooper",
        "Her": "Alyssa",

        "Cooper": "Cooper",
        "Alyssa": "Alyssa"

    };

    const speakerName =
        speakerNames[dialogue.speaker] ||
        dialogue.speaker;


    speakerElement.textContent = speakerName;

    dialogueTextElement.textContent = dialogue.text;

    dialogueBox.classList.remove("hidden");

}


/* =========================================================
   ADVANCE DIALOGUE
========================================================= */

function advanceDialogue() {

    if (!gameStarted) {
        return;
    }

    if (!showingDialogue) {
        return;
    }

    currentDialogue++;

    const chapter = getCurrentChapter();

    if (currentDialogue >= chapter.length) {

        dialogueBox.classList.add("hidden");

        showingDialogue = false;

        nextChapter();

        return;

    }

    showDialogue();

}


/* =========================================================
   NEXT CHAPTER
========================================================= */

function nextChapter() {

    currentChapter++;

    currentDialogue = 0;

    if (currentChapter >= chapterInfo.length) {

        dialogueBox.classList.remove("hidden");

        speakerElement.textContent = "Cooper";

        dialogueTextElement.textContent =
            "This is only the beginning of the rest of our story. ❤️";

        return;

    }

    player.x = 120;

    showChapterTitle();

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    gameStarted = true;

    currentChapter = 0;

    currentDialogue = 0;

    player.x = 120;

    titleScreen.classList.add("hidden");

    showChapterTitle();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {

        keys.left = true;

    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {

        keys.right = true;

    }

    if (
        event.key === " " ||
        event.key === "Enter"
    ) {

        if (gameStarted) {

            event.preventDefault();

            advanceDialogue();

        }

    }

});


document.addEventListener("keyup", function(event) {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {

        keys.left = false;

    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {

        keys.right = false;

    }

});


startButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (keys.left) {
        player.x -= player.speed;
    }

    if (keys.right) {
        player.x += player.speed;
    }

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.x > canvas.width - player.width) {
        player.x = canvas.width - player.width;
    }

}


/* =========================================================
   SKY
========================================================= */

function drawSky(day = true) {

    let gradient;

    if (day) {

        gradient = ctx.createLinearGradient(
            0, 0,
            0, canvas.height
        );

        gradient.addColorStop(
            0,
            "#72c9f5"
        );

        gradient.addColorStop(
            1,
            "#e5f8ff"
        );

    } else {

        gradient = ctx.createLinearGradient(
            0, 0,
            0, canvas.height
        );

        gradient.addColorStop(
            0,
            "#101936"
        );

        gradient.addColorStop(
            1,
            "#465080"
        );

    }

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(x, y, scale = 1) {

    ctx.fillStyle = "rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 30 * scale,
        y - 10 * scale,
        32 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 65 * scale,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   GRASS
========================================================= */

function drawGrass() {

    ctx.fillStyle = "#75bd50";

    ctx.fillRect(
        0,
        420,
        canvas.width,
        120
    );

    ctx.fillStyle = "#5da340";

    ctx.fillRect(
        0,
        420,
        canvas.width,
        8
    );

}


/* =========================================================
   TREE
========================================================= */

function drawTree(x, y, scale = 1) {

    ctx.fillStyle = "#79502f";

    ctx.fillRect(
        x - 12 * scale,
        y,
        24 * scale,
        100 * scale
    );

    ctx.fillStyle = "#3e913d";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        48 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x - 35 * scale,
        y + 25 * scale,
        35 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 35 * scale,
        y + 25 * scale,
        35 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   HOUSE
========================================================= */

function drawHouse(x = 650, y = 275) {

    ctx.fillStyle = "#f1d0a7";

    ctx.fillRect(
        x,
        y + 70,
        190,
        145
    );

    ctx.fillStyle = "#a94343";

    ctx.beginPath();

    ctx.moveTo(
        x - 25,
        y + 70
    );

    ctx.lineTo(
        x + 95,
        y
    );

    ctx.lineTo(
        x + 215,
        y + 70
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "#704214";

    ctx.fillRect(
        x + 78,
        y + 130,
        45,
        85
    );

    ctx.fillStyle = "#9de4ff";

    ctx.fillRect(
        x + 20,
        y + 105,
        45,
        45
    );

    ctx.fillRect(
        x + 135,
        y + 105,
        45,
        45
    );

}


/* =========================================================
   FENCE
========================================================= */

function drawFence() {

    ctx.fillStyle = "#eee";

    for (
        let x = 0;
        x < canvas.width;
        x += 45
    ) {

        ctx.fillRect(
            x,
            385,
            8,
            50
        );

    }

    ctx.fillRect(
        0,
        398,
        canvas.width,
        8
    );

    ctx.fillRect(
        0,
        425,
        canvas.width,
        8
    );

}


/* =========================================================
   GIFT BASKET
========================================================= */

function drawGiftBasket() {

    const x = 330;
    const y = 370;

    ctx.fillStyle = "#9b5d32";

    ctx.fillRect(
        x,
        y,
        65,
        35
    );

    ctx.strokeStyle = "#75411f";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        x + 32,
        y,
        30,
        Math.PI,
        0
    );

    ctx.stroke();

    ctx.fillStyle = "#ff6f91";

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y - 8,
        8,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 43,
        y - 8,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   AIRPORT
========================================================= */

function drawAirport() {

    ctx.fillStyle = "#d9dde3";

    ctx.fillRect(
        0,
        285,
        canvas.width,
        135
    );

    /* Airport windows */

    ctx.fillStyle = "#8ec8e8";

    for (
        let x = 30;
        x < 930;
        x += 90
    ) {

        ctx.fillRect(
            x,
            310,
            65,
            60
        );

    }

    /* Roof */

    ctx.fillStyle = "#777";

    ctx.fillRect(
        0,
        270,
        canvas.width,
        20
    );

    /* Airport sign */

    ctx.fillStyle = "#1f4e79";

    ctx.fillRect(
        365,
        180,
        230,
        70
    );

    ctx.fillStyle = "white";

    ctx.font = "bold 34px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "PITTSBURGH",
        480,
        225
    );

    ctx.textAlign = "left";


    /* Runway */

    ctx.fillStyle = "#444";

    ctx.fillRect(
        0,
        420,
        canvas.width,
        120
    );

    ctx.strokeStyle = "#fff";

    ctx.lineWidth = 5;

    for (
        let x = 0;
        x < canvas.width;
        x += 80
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            475
        );

        ctx.lineTo(
            x + 40,
            475
        );

        ctx.stroke();

    }

}


/* =========================================================
   AIRPLANE
========================================================= */

function drawAirplane(x, y, scale = 1) {

    ctx.fillStyle = "#f5f5f5";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        90 * scale,
        15 * scale,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x - 10 * scale,
        y
    );

    ctx.lineTo(
        x - 50 * scale,
        y - 40 * scale
    );

    ctx.lineTo(
        x - 25 * scale,
        y
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x + 20 * scale,
        y
    );

    ctx.lineTo(
        x + 55 * scale,
        y + 35 * scale
    );

    ctx.lineTo(
        x + 40 * scale,
        y
    );

    ctx.fill();

}


/* =========================================================
   WEDDING ARCH
========================================================= */

function drawWeddingArch() {

    ctx.strokeStyle = "#fff";

    ctx.lineWidth = 15;

    ctx.beginPath();

    ctx.moveTo(
        300,
        410
    );

    ctx.lineTo(
        300,
        260
    );

    ctx.quadraticCurveTo(
        480,
        120,
        660,
        260
    );

    ctx.lineTo(
        660,
        410
    );

    ctx.stroke();


    /* Flowers */

    const flowers = [

        [315,270],
        [350,235],
        [390,205],
        [430,180],
        [475,165],
        [520,180],
        [565,205],
        [610,235],
        [645,270]

    ];

    for (const [x,y] of flowers) {

        ctx.fillStyle = "#ff9fbc";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================================================
   WEDDING CHAIRS
========================================================= */

function drawWeddingChairs() {

    for (
        let x = 60;
        x < 900;
        x += 100
    ) {

        ctx.fillStyle = "#eee";

        ctx.fillRect(
            x,
            350,
            45,
            65
        );

        ctx.fillRect(
            x + 5,
            330,
            35,
            35
        );

    }

}


/* =========================================================
   NIGHT SKY
========================================================= */

function drawStars() {

    const stars = [

        [70,80],
        [150,125],
        [230,65],
        [315,110],
        [390,55],
        [470,90],
        [550,45],
        [635,120],
        [720,70],
        [805,115],
        [900,60],

        [110,180],
        [280,160],
        [450,175],
        [620,170],
        [780,185]

    ];

    ctx.fillStyle = "white";

    for (const [x,y] of stars) {

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================================================
   MOON
========================================================= */

function drawMoon() {

    ctx.fillStyle = "#fff5c4";

    ctx.beginPath();

    ctx.arc(
        800,
        100,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#101936";

    ctx.beginPath();

    ctx.arc(
        820,
        85,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   DISTANCE CITY
========================================================= */

function drawCity() {

    const buildings = [

        [40,300,90,120],
        [150,250,100,170],
        [270,315,80,105],
        [375,230,115,190],
        [520,285,90,135],
        [635,245,100,175],
        [760,300,80,120],
        [865,260,70,160]

    ];

    ctx.fillStyle = "#20294b";

    for (const building of buildings) {

        ctx.fillRect(
            building[0],
            building[1],
            building[2],
            building[3]
        );

    }

    /* Windows */

    ctx.fillStyle = "#ffd86b";

    for (const building of buildings) {

        const x = building[0];
        const y = building[1];
        const w = building[2];

        for (
            let wx = x + 15;
            wx < x + w - 10;
            wx += 25
        ) {

            for (
                let wy = y + 20;
                wy < 400;
                wy += 30
            ) {

                ctx.fillRect(
                    wx,
                    wy,
                    8,
                    10
                );

            }

        }

    }

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer() {

    const x = player.x;
    const y = player.y;

    /* Body */

    ctx.fillStyle = "#4b6cb7";

    ctx.fillRect(
        x + 8,
        y + 20,
        24,
        35
    );

    /* Head */

    ctx.fillStyle = "#f2c6a0";

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y + 12,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Hair */

    ctx.fillStyle = "#4a2c20";

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y + 8,
        13,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    /* Legs */

    ctx.fillStyle = "#333";

    ctx.fillRect(
        x + 9,
        y + 55,
        8,
        12
    );

    ctx.fillRect(
        x + 23,
        y + 55,
        8,
        12
    );

}

   BACKGROUND FOR CHAPTER 1

    drawSky(true);

    );

    );

    drawCloud(820, 115, .8);

/* =========================================================
   BACKGROUND FOR CHAPTER 3
========================================================= */

function drawPittsburghBackground() {

    drawSky(true);

    drawAirport();

    drawAirplane(
        720,
        150,
        .8
    );

}


/* =========================================================
   BACKGROUND FOR CHAPTER 4
========================================================= */

function drawWeddingBackground() {

    drawSky(true);

    drawCloud(120, 80, .8);
    drawCloud(750, 90, .9);

    drawGrass();

    drawWeddingChairs();

    drawWeddingArch();

}


/* =========================================================
   BACKGROUND FOR CHAPTER 5
========================================================= */

function drawDistanceBackground() {

    drawSky(false);

    drawStars();

    drawMoon();

    drawCity();

    ctx.fillStyle = "#11182e";

    ctx.fillRect(
        0,
        420,
        canvas.width,
        120
    );

}


/* =========================================================
   DRAW CURRENT WORLD
========================================================= */

function drawWorld() {

    /*
       THIS IS WHAT MAKES EACH LEVEL HAVE
       ITS OWN BACKGROUND.
    */

    if (currentChapter === 0) {

        drawFirstMeetingBackground();

    }

    else if (currentChapter === 1) {

        drawGirlfriendBackground();

    }

    else if (currentChapter === 2) {

        drawPittsburghBackground();

    }

    else if (currentChapter === 3) {

        drawWeddingBackground();

    }

    else if (currentChapter === 4) {

        drawDistanceBackground();

    }


    drawPlayer();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    updatePlayer();

    drawWorld();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   START
========================================================= */

gameLoop();

</script>
