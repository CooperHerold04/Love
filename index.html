<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Adventure ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

#game {
    width: 960px;
    height: 540px;
    position: relative;
    overflow: hidden;
    background: #87CEEB;
}

canvas {
    width: 960px;
    height: 540px;
    display: block;
}

/* TITLE SCREEN */

#titleScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(#ffb6c1, #ff8fa3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#titleScreen h1 {
    font-size: 52px;
    color: white;
    margin: 0 0 15px;
    text-shadow: 3px 3px 5px rgba(0,0,0,0.25);
}

#titleScreen p {
    color: white;
    font-size: 20px;
    margin-bottom: 30px;
}

button {
    border: none;
    background: #ff4f70;
    color: white;
    font-size: 20px;
    padding: 14px 30px;
    border-radius: 12px;
    cursor: pointer;
}

button:hover {
    background: #ff3158;
}

/* CHAPTER TITLE */

#chapterTitle {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 15;
    color: white;
    pointer-events: none;
}

#chapterTitle h1 {
    font-size: 48px;
    margin: 0;
}

#chapterTitle p {
    font-size: 24px;
    margin-top: 10px;
}

/* DIALOGUE */

#dialogueBox {
    position: absolute;
    left: 40px;
    right: 40px;
    bottom: 25px;
    min-height: 135px;

    background: rgba(20,20,20,0.92);
    border: 3px solid white;
    border-radius: 15px;

    padding: 20px;

    color: white;
    z-index: 10;
}

#speaker {
    font-size: 22px;
    font-weight: bold;
    color: #ff8fa3;
    margin-bottom: 8px;
}

#dialogueText {
    font-size: 20px;
    line-height: 1.4;
}

#continueText {
    position: absolute;
    right: 18px;
    bottom: 10px;
    font-size: 13px;
    color: #ccc;
}

.hidden {
    display: none !important;
}

</style>
</head>

<body>

<div id="game">

    <canvas id="canvas" width="960" height="540"></canvas>

    <!-- TITLE SCREEN -->

    <div id="titleScreen">

        <h1>Our Little Adventure ❤️</h1>

        <p>A story about us</p>

        <button id="startButton">
            Start Our Story
        </button>

    </div>

    <!-- CHAPTER TITLE -->

    <div id="chapterTitle" class="hidden">

        <h1 id="chapterTitleText">
            CHAPTER 1
        </h1>

        <p id="chapterSubtitle">
            The Beginning
        </p>

    </div>

    <!-- DIALOGUE -->

    <div id="dialogueBox" class="hidden">

        <div id="speaker"></div>

        <div id="dialogueText"></div>

        <div id="continueText">
            Press SPACE or ENTER to continue
        </div>

    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


/* =========================================================
   UI ELEMENTS
========================================================= */

const titleScreen = document.getElementById("titleScreen");

const chapterTitle = document.getElementById("chapterTitle");
const chapterTitleText = document.getElementById("chapterTitleText");
const chapterSubtitle = document.getElementById("chapterSubtitle");

const dialogueBox = document.getElementById("dialogueBox");
const speakerElement = document.getElementById("speaker");
const dialogueTextElement = document.getElementById("dialogueText");

const startButton = document.getElementById("startButton");


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

let currentChapter = 1;

let currentDialogue = 0;

let dialogueActive = false;

let firstMeetingTriggered = false;

let girlfriendQuestionTriggered = false;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 180,

    y: 390,

    width: 32,

    height: 44,

    speed: 4

};


let keys = {};


/* =========================================================
   DIALOGUE
========================================================= */

const chapters = {

    firstMeeting: [

        {
            speaker: "You",
            text: "I still remember our first meeting."
        },

        {
            speaker: "You",
            text: "I had no idea that meeting you would change my life."
        },

        {
            speaker: "You",
            text: "At first, I was probably a little nervous."
        },

        {
            speaker: "You",
            text: "But talking to you felt so easy."
        },

        {
            speaker: "You",
            text: "Before I knew it, I was looking forward to every conversation."
        },

        {
            speaker: "You",
            text: "Somehow, you became one of my favorite people."
        },

        {
            speaker: "You",
            text: "And I wanted to know you more."
        },

        {
            speaker: "You",
            text: "I didn't know where this little adventure would take us..."
        },

        {
            speaker: "You",
            text: "But I'm really glad I took that first step."
        },

        {
            speaker: "You",
            text: "Because that first meeting eventually led me to you."
        },

        {
            speaker: "You",
            text: "And this was only the beginning. ❤️"
        }

    ],


    girlfriendQuestion: [

        {
            speaker: "You",
            text: "It was early in the morning..."
        },

        {
            speaker: "You",
            text: "And I had a plan."
        },

        {
            speaker: "You",
            text: "I grabbed a gift basket..."
        },

        {
            speaker: "You",
            text: "And somehow convinced myself that sneaking into your backyard was a good idea."
        },

        {
            speaker: "You",
            text: "I was probably more nervous than I wanted to admit."
        },

        {
            speaker: "You",
            text: "But there was something I really wanted to ask you."
        },

        {
            speaker: "You",
            text: "I didn't want to just keep wondering what we could become."
        },

        {
            speaker: "You",
            text: "I wanted you to be mine."
        },

        {
            speaker: "You",
            text: "So I showed up..."
        },

        {
            speaker: "You",
            text: "With a gift basket..."
        },

        {
            speaker: "You",
            text: "And a very important question."
        },

        {
            speaker: "You",
            text: "Would you be my girlfriend?"
        },

        {
            speaker: "Her",
            text: "..."
        },

        {
            speaker: "Her",
            text: "Of course. ❤️"
        },

        {
            speaker: "You",
            text: "And just like that..."
        },

        {
            speaker: "You",
            text: "Our story became something even more special."
        },

        {
            speaker: "You",
            text: "I had no idea how many memories we were about to make."
        },

        {
            speaker: "You",
            text: "But I knew I wanted to make them with you."
        },

        {
            speaker: "You",
            text: "And I'm so glad I did."
        },

        {
            speaker: "You",
            text: "Because look at us now. ❤️"
        }

    ]

};


/* =========================================================
   GET CURRENT DIALOGUE
========================================================= */

function getCurrentDialogue() {

    if (currentChapter === 1) {

        return chapters.firstMeeting;

    }

    if (currentChapter === 2) {

        return chapters.girlfriendQuestion;

    }

    return [];

}


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener("click", startGame);


function startGame() {

    gameStarted = true;

    titleScreen.classList.add("hidden");

    currentChapter = 1;

    currentDialogue = 0;

    firstMeetingTriggered = false;

    girlfriendQuestionTriggered = false;

    player.x = 180;

    showChapter(
        "CHAPTER 1",
        "The Beginning"
    );

}


/* =========================================================
   SHOW CHAPTER TITLE
========================================================= */

function showChapter(title, subtitle) {

    chapterTitleText.textContent = title;

    chapterSubtitle.textContent = subtitle;

    chapterTitle.classList.remove("hidden");

    setTimeout(() => {

        chapterTitle.classList.add("hidden");

    }, 3000);

}


/* =========================================================
   START DIALOGUE
========================================================= */

function startDialogue() {

    if (dialogueActive) {
        return;
    }

    dialogueActive = true;

    currentDialogue = 0;

    dialogueBox.classList.remove("hidden");

    displayDialogue(
        getCurrentDialogue()[currentDialogue]
    );

}


/* =========================================================
   DISPLAY DIALOGUE
========================================================= */

function displayDialogue(dialogue) {

    if (!dialogue) {
        return;
    }

    speakerElement.textContent = dialogue.speaker;

    dialogueTextElement.textContent = dialogue.text;

}


/* =========================================================
   NEXT DIALOGUE
========================================================= */

function nextDialogue() {

    if (!dialogueActive) {
        return;
    }

    const dialogue = getCurrentDialogue();

    currentDialogue++;

    if (currentDialogue >= dialogue.length) {

        endDialogue();

        return;

    }

    displayDialogue(
        dialogue[currentDialogue]
    );

}


/* =========================================================
   END DIALOGUE
========================================================= */

function endDialogue() {

    dialogueActive = false;

    dialogueBox.classList.add("hidden");

    currentDialogue = 0;


    /* -----------------------------------------------------
       CHAPTER 1 → CHAPTER 2
    ----------------------------------------------------- */

    if (currentChapter === 1) {

        currentChapter = 2;

        player.x = 150;

        girlfriendQuestionTriggered = false;

        showChapter(
            "CHAPTER 2",
            "The Question"
        );

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;


    if (
        event.code === "Space" ||
        event.code === "Enter"
    ) {

        if (dialogueActive) {

            event.preventDefault();

            nextDialogue();

        }

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (dialogueActive) {
        return;
    }


    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.x += player.speed;

    }


    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.x -= player.speed;

    }


    /* Keep player inside screen */

    if (player.x < 20) {

        player.x = 20;

    }

    if (player.x > 900) {

        player.x = 900;

    }


    /* =====================================================
       CHAPTER 1 TRIGGER
    ===================================================== */

    if (currentChapter === 1) {

        if (
            !firstMeetingTriggered &&
            player.x > 720
        ) {

            firstMeetingTriggered = true;

            startDialogue();

        }

    }


    /* =====================================================
       CHAPTER 2 TRIGGER
    ===================================================== */

    if (currentChapter === 2) {

        if (
            !girlfriendQuestionTriggered &&
            player.x > 700
        ) {

            girlfriendQuestionTriggered = true;

            startDialogue();

        }

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x = player.x;
    const y = player.y;


    /* Body */

    ctx.fillStyle = "#3f6fd9";

    ctx.fillRect(
        x,
        y + 15,
        player.width,
        29
    );


    /* Head */

    ctx.fillStyle = "#ffd0a6";

    ctx.beginPath();

    ctx.arc(
        x + 16,
        y + 10,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle = "#4b2d1f";

    ctx.beginPath();

    ctx.arc(
        x + 16,
        y + 7,
        12,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Legs */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        x + 4,
        y + 40,
        9,
        4
    );

    ctx.fillRect(
        x + 20,
        y + 40,
        9,
        4
    );

}


/* =========================================================
   CHAPTER 1 BACKGROUND
========================================================= */

function drawChapter1() {

    /* Sky */

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        540
    );


    /* Clouds */

    drawCloud(150, 90);
    drawCloud(450, 70);
    drawCloud(750, 120);


    /* Ground */

    ctx.fillStyle = "#69b34c";

    ctx.fillRect(
        0,
        350,
        960,
        190
    );


    /* Path */

    ctx.fillStyle = "#d8b27c";

    ctx.beginPath();

    ctx.moveTo(350, 540);
    ctx.lineTo(560, 540);
    ctx.lineTo(520, 350);
    ctx.lineTo(400, 350);

    ctx.closePath();

    ctx.fill();


    /* Trees */

    drawTree(100, 280);
    drawTree(850, 275);


    /* Sign */

    ctx.fillStyle = "#754c24";

    ctx.fillRect(
        790,
        270,
        12,
        90
    );


    ctx.fillStyle = "#fff";

    ctx.fillRect(
        710,
        210,
        170,
        70
    );


    ctx.strokeStyle = "#754c24";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        710,
        210,
        170,
        70
    );


    ctx.fillStyle = "#ff4f70";

    ctx.font = "bold 20px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "FIRST MEETING ❤️",
        795,
        250
    );

    ctx.textAlign = "left";


    /* Small flowers */

    drawFlower(300, 380);
    drawFlower(620, 410);
    drawFlower(680, 390);

}


/* =========================================================
   CHAPTER 2 BACKGROUND
========================================================= */

function drawChapter2() {

    /* Morning sky */

    ctx.fillStyle = "#f7cfa4";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        540
    );


    /* Sunrise */

    ctx.fillStyle = "#ffd76a";

    ctx.beginPath();

    ctx.arc(
        770,
        110,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Clouds */

    drawCloud(170, 80);
    drawCloud(450, 110);


    /* Grass */

    ctx.fillStyle = "#6eaa4f";

    ctx.fillRect(
        0,
        350,
        960,
        190
    );


    /* Backyard path */

    ctx.fillStyle = "#c9a06b";

    ctx.beginPath();

    ctx.moveTo(250, 540);
    ctx.lineTo(550, 540);
    ctx.lineTo(620, 350);
    ctx.lineTo(420, 350);

    ctx.closePath();

    ctx.fill();


    /* House */

    ctx.fillStyle = "#f2e1c9";

    ctx.fillRect(
        570,
        180,
        300,
        190
    );


    /* Roof */

    ctx.fillStyle = "#7c4b35";

    ctx.beginPath();

    ctx.moveTo(530, 180);

    ctx.lineTo(720, 70);

    ctx.lineTo(910, 180);

    ctx.closePath();

    ctx.fill();


    /* Window */

    ctx.fillStyle = "#9dd8f2";

    ctx.fillRect(
        680,
        220,
        80,
        70
    );


    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        680,
        220,
        80,
        70
    );


    ctx.beginPath();

    ctx.moveTo(720, 220);
    ctx.lineTo(720, 290);

    ctx.moveTo(680, 255);
    ctx.lineTo(760, 255);

    ctx.stroke();


    /* Door */

    ctx.fillStyle = "#805333";

    ctx.fillRect(
        810,
        270,
        45,
        100
    );


    /* Fence */

    drawFence();


    /* Gift basket */

    drawGiftBasket(
        780,
        365
    );


    /* Flowers */

    drawFlower(200, 390);
    drawFlower(260, 420);
    drawFlower(910, 400);

}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(x, y) {

    ctx.fillStyle = "rgba(255,255,255,0.85)";

    ctx.beginPath();

    ctx.arc(x, y, 25, 0, Math.PI * 2);

    ctx.arc(x + 30, y - 10, 32, 0, Math.PI * 2);

    ctx.arc(x + 65, y, 25, 0, Math.PI * 2);

    ctx.fill();

}


/* =========================================================
   TREE
========================================================= */

function drawTree(x, y) {

    /* Trunk */

    ctx.fillStyle = "#754c24";

    ctx.fillRect(
        x - 12,
        y,
        24,
        90
    );


    /* Leaves */

    ctx.fillStyle = "#347a38";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x - 35,
        y + 5,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 35,
        y + 5,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   FLOWER
========================================================= */

function drawFlower(x, y) {

    ctx.fillStyle = "#3c8c40";

    ctx.fillRect(
        x - 2,
        y,
        4,
        25
    );


    ctx.fillStyle = "#ff6f91";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#ffd34d";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   FENCE
========================================================= */

function drawFence() {

    ctx.fillStyle = "#eee0c0";

    for (
        let x = 30;
        x < 950;
        x += 55
    ) {

        ctx.fillRect(
            x,
            315,
            10,
            80
        );

    }


    ctx.fillRect(
        0,
        330,
        960,
        10
    );

    ctx.fillRect(
        0,
        365,
        960,
        10
    );

}


/* =========================================================
   GIFT BASKET
========================================================= */

function drawGiftBasket(x, y) {

    /* Basket */

    ctx.fillStyle = "#9b632e";

    ctx.fillRect(
        x,
        y,
        70,
        45
    );


    /* Basket top */

    ctx.fillStyle = "#c88b45";

    ctx.fillRect(
        x - 5,
        y - 5,
        80,
        10
    );


    /* Handle */

    ctx.strokeStyle = "#754c24";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        x + 35,
        y,
        32,
        Math.PI,
        Math.PI * 2
    );

    ctx.stroke();


    /* Ribbon */

    ctx.fillStyle = "#ff4f70";

    ctx.fillRect(
        x + 28,
        y,
        14,
        45
    );


    /* Bow */

    ctx.beginPath();

    ctx.arc(
        x + 22,
        y - 5,
        10,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 48,
        y - 5,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#ffd34d";

    ctx.beginPath();

    ctx.arc(
        x + 35,
        y - 5,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Label */

    ctx.fillStyle = "#fff";

    ctx.font = "bold 12px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "❤️",
        x + 35,
        y + 28
    );

    ctx.textAlign = "left";

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    if (currentChapter === 1) {

        drawChapter1();

    }

    else if (currentChapter === 2) {

        drawChapter2();

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    updatePlayer();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START LOOP
========================================================= */

gameLoop();

</script>

</body>
</html>
```
