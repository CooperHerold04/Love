<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Adventure ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Georgia, serif;

    display: flex;
    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

#game {
    position: relative;

    width: 960px;
    height: 540px;

    max-width: 100vw;
    max-height: 100vh;

    overflow: hidden;

    background: #87CEEB;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;

    image-rendering: pixelated;
}


/* =========================================
   TITLE
========================================= */

#titleScreen {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            rgba(20,20,40,0.35),
            rgba(20,20,40,0.75)
        );

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;
}

#titleScreen h1 {
    font-size: 58px;
    margin: 0 0 10px;

    text-shadow: 3px 3px 0 #000;
}

#titleScreen p {
    font-size: 20px;
    margin-bottom: 35px;
}

#startButton {
    padding: 14px 35px;

    border: none;
    border-radius: 10px;

    background: white;
    color: #222;

    font-family: Georgia, serif;
    font-size: 20px;

    cursor: pointer;
}

#startButton:hover {
    transform: scale(1.08);
}


/* =========================================
   CHAPTER TITLE
========================================= */

#chapterTitle {
    position: absolute;

    top: 35%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 8;

    pointer-events: none;

    text-shadow: 3px 3px 0 #000;
}

#chapterNumber {
    font-size: 20px;
}

#chapterName {
    font-size: 50px;
    margin: 5px 0;
}

.chapterHidden {
    display: none;
}


/* =========================================
   DIALOGUE
========================================= */

#dialogue {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    width: 88%;

    padding: 18px 22px;

    background: rgba(15,15,25,0.96);

    border: 3px solid white;
    border-radius: 12px;

    z-index: 20;
}

#speaker {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 8px;
}

#dialogueText {
    font-size: 19px;
    line-height: 1.45;

    min-height: 55px;
}

#continueButton {
    margin-top: 12px;

    padding: 8px 16px;

    border: none;
    border-radius: 7px;

    cursor: pointer;

    font-family: Georgia, serif;
}

.hidden {
    display: none !important;
}

</style>
</head>


<body>

<div id="game">

<canvas
    id="gameCanvas"
    width="960"
    height="540">
</canvas>


<!-- TITLE SCREEN -->

<div id="titleScreen">

    <h1>Our Little Adventure ❤️</h1>

    <p>
        A very small game about a very big story.
    </p>

    <button id="startButton">
        Start Adventure
    </button>

</div>


<!-- CHAPTER TITLE -->

<div
    id="chapterTitle"
    class="chapterHidden">

    <div id="chapterNumber">
        CHAPTER 1
    </div>

    <div id="chapterName">
        The Beginning
    </div>

</div>


<!-- DIALOGUE -->

<div
    id="dialogue"
    class="hidden">

    <div id="speaker"></div>

    <div id="dialogueText"></div>

    <button id="continueButton">
        Continue ❤️
    </button>

</div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================================
   UI
========================================= */

const titleScreen =
    document.getElementById("titleScreen");

const startButton =
    document.getElementById("startButton");

const dialogueBox =
    document.getElementById("dialogue");

const speakerElement =
    document.getElementById("speaker");

const dialogueTextElement =
    document.getElementById("dialogueText");

const continueButton =
    document.getElementById("continueButton");

const chapterTitle =
    document.getElementById("chapterTitle");

const chapterNumber =
    document.getElementById("chapterNumber");

const chapterName =
    document.getElementById("chapterName");


/* =========================================
   GAME STATE
========================================= */

let gameStarted = false;

let dialogueActive = false;

let currentChapter = 1;

let currentDialogue = 0;


/* =========================================
   TRIGGERS
========================================= */

let firstMeetingTriggered = false;

let girlfriendQuestionTriggered = false;


/* =========================================
   PLAYER
========================================= */

const player = {

    x: 180,

    y: 390,

    width: 32,

    height: 44,

    speed: 4

};


/* =========================================
   KEYBOARD
========================================= */

const keys = {};


/* =========================================
   KEY DOWN
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;


        /*
           SPACE OR ENTER
           ADVANCES DIALOGUE
        */

        if (
            dialogueActive &&
            (
                event.key === " " ||
                event.key === "Enter"
            )
        ) {

            event.preventDefault();

            nextDialogue();

        }

    }
);


/* =========================================
   KEY UP
========================================= */

document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================================
   STORY
========================================= */

const chapters = {

    /* =====================================
       CHAPTER 1
    ===================================== */

    firstMeeting: {

        title: "The Beginning",

        dialogue: [

            {
                speaker: "Narrator",
                text:
                "It started with two people who had never met."
            },

            {
                speaker: "Narrator",
                text:
                "Then, one day... they matched on Hinge."
            },

            {
                speaker: "Cooper",
                text:
                "Want to go on a date?"
            },

            {
                speaker: "Her",
                text:
                "Sure! ❤️"
            },

            {
                speaker: "Her (secretly)",
                text:
                "Please cancel. Please cancel. Please cancel. 😂"
            },

            {
                speaker: "Narrator",
                text:
                "But he didn't cancel."
            },

            {
                speaker: "Narrator",
                text:
                "And neither did she."
            },

            {
                speaker: "Narrator",
                text:
                "So they went on their first date..."
            },

            {
                speaker: "Narrator",
                text:
                "...and somehow, things started going really well."
            },

            {
                speaker: "Narrator",
                text:
                "Neither of them knew it yet..."
            },

            {
                speaker: "Narrator",
                text:
                "but this was only the beginning."
            }

        ]

    },


    /* =====================================
       CHAPTER 2
    ===================================== */

    girlfriendQuestion: {

        title: "The Question",

        dialogue: [

            {
                speaker: "Narrator",
                text:
                "A little time passed..."
            },

            {
                speaker: "Narrator",
                text:
                "And Cooper realized there was something he wanted to ask."
            },

            {
                speaker: "Narrator",
                text:
                "So, one early morning..."
            },

            {
                speaker: "Narrator",
                text:
                "he quietly made his way into her backyard."
            },

            {
                speaker: "Narrator",
                text:
                "He wasn't empty-handed, either."
            },

            {
                speaker: "Cooper",
                text:
                "Okay... I hope she likes this."
            },

            {
                speaker: "Narrator",
                text:
                "He brought her a gift basket."
            },

            {
                speaker: "Narrator",
                text:
                "Now there was only one thing left to do."
            },

            {
                speaker: "Cooper",
                text:
                "Hey..."
            },

            {
                speaker: "Her",
                text:
                "What are you doing here so early? 😂"
            },

            {
                speaker: "Cooper",
                text:
                "I wanted to give you something."
            },

            {
                speaker: "Her",
                text:
                "Aww... what's this? ❤️"
            },

            {
                speaker: "Cooper",
                text:
                "There's something else I wanted to ask you."
            },

            {
                speaker: "Her",
                text:
                "What?"
            },

            {
                speaker: "Cooper",
                text:
                "Will you be my girlfriend?"
            },

            {
                speaker: "Her",
                text:
                "Yes. ❤️"
            },

            {
                speaker: "Narrator",
                text:
                "And just like that..."
            },

            {
                speaker: "Narrator",
                text:
                "they became something more."
            },

            {
                speaker: "Narrator",
                text:
                "But their story was only getting started."
            }

        ]

    }

};


/* =========================================
   START GAME
========================================= */

startButton.addEventListener(
    "click",
    function() {

        titleScreen.classList.add("hidden");

        gameStarted = true;

        currentChapter = 1;

        currentDialogue = 0;

        player.x = 180;

        showChapter(
            "CHAPTER 1",
            "The Beginning"
        );

    }
);


/* =========================================
   SHOW CHAPTER
========================================= */

function showChapter(number, name) {

    chapterNumber.textContent = number;

    chapterName.textContent = name;

    chapterTitle.classList.remove(
        "chapterHidden"
    );


    setTimeout(
        function() {

            chapterTitle.classList.add(
                "chapterHidden"
            );

        },
        3000
    );

}


/* =========================================
   GET CURRENT DIALOGUE
========================================= */

function getCurrentDialogue() {

    if (currentChapter === 1) {

        return chapters.firstMeeting.dialogue;

    }

    if (currentChapter === 2) {

        return chapters.girlfriendQuestion.dialogue;

    }

    return [];

}


/* =========================================
   START DIALOGUE
========================================= */

function startDialogue(dialogue) {

    if (dialogueActive) {
        return;
    }

    dialogueActive = true;

    currentDialogue = 0;

    dialogueBox.classList.remove(
        "hidden"
    );

    displayDialogue(
        dialogue[0]
    );

}


/* =========================================
   DISPLAY DIALOGUE
========================================= */

function displayDialogue(line) {

    speakerElement.textContent =
        line.speaker;

    dialogueTextElement.textContent =
        line.text;

}


/* =========================================
   NEXT DIALOGUE
========================================= */

function nextDialogue() {

    const dialogue =
        getCurrentDialogue();


    /*
       MOVE TO NEXT LINE
    */

    currentDialogue++;


    /*
       CHECK IF CHAPTER IS FINISHED
    */

    if (
        currentDialogue >=
        dialogue.length
    ) {

        endDialogue();


        /*
           CHAPTER 1 → CHAPTER 2
        */

        if (currentChapter === 1) {

            startChapter2();

        }

        return;

    }


    /*
       OTHERWISE SHOW NEXT LINE
    */

    displayDialogue(
        dialogue[currentDialogue]
    );

}


/* =========================================
   END DIALOGUE
========================================= */

function endDialogue() {

    dialogueActive = false;

    dialogueBox.classList.add(
        "hidden"
    );

    currentDialogue = 0;

}


/* =========================================
   START CHAPTER 2
========================================= */

function startChapter2() {

    currentChapter = 2;

    player.x = 180;

    girlfriendQuestionTriggered = false;


    /*
       SHOW CHAPTER 2 TITLE
    */

    showChapter(
        "CHAPTER 2",
        "The Question"
    );

}


/* =========================================
   BACKGROUND
========================================= */

function drawBackground() {

    if (currentChapter === 1) {

        drawChapter1();

    }

    else if (currentChapter === 2) {

        drawChapter2();

    }

}


/* =========================================
   CHAPTER 1 BACKGROUND
========================================= */

function drawChapter1() {

    /* SKY */

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        320
    );


    /* GRASS */

    ctx.fillStyle = "#65A854";

    ctx.fillRect(
        0,
        320,
        canvas.width,
        220
    );


    /* SUN */

    ctx.fillStyle = "#FFD966";

    ctx.beginPath();

    ctx.arc(
        820,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CLOUDS */

    drawCloud(150,90);

    drawCloud(450,130);

    drawCloud(700,60);


    /* PATH */

    ctx.fillStyle = "#D5B98A";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        80
    );


    /* FLOWERS */

    drawFlower(100,340);

    drawFlower(130,355);

    drawFlower(750,350);

    drawFlower(800,330);

    drawFlower(870,360);


    /* SIGN */

    drawFirstMeetingSign();

}


/* =========================================
   CHAPTER 2 BACKGROUND
========================================= */

function drawChapter2() {

    /* MORNING SKY */

    ctx.fillStyle = "#F7CFA5";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        320
    );


    /* SUN */

    ctx.fillStyle = "#FFD98A";

    ctx.beginPath();

    ctx.arc(
        760,
        100,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* GRASS */

    ctx.fillStyle = "#5E984D";

    ctx.fillRect(
        0,
        320,
        canvas.width,
        220
    );


    /* FENCE */

    ctx.fillStyle = "#D6B27C";

    for (
        let x = 0;
        x < canvas.width;
        x += 45
    ) {

        ctx.fillRect(
            x,
            250,
            32,
            110
        );

    }


    ctx.fillStyle = "#B58D5E";

    ctx.fillRect(
        0,
        250,
        canvas.width,
        12
    );

    ctx.fillRect(
        0,
        310,
        canvas.width,
        12
    );


    /* HOUSE */

    ctx.fillStyle = "#F2E1C9";

    ctx.fillRect(
        590,
        150,
        280,
        180
    );


    /* ROOF */

    ctx.fillStyle = "#7D4F50";

    ctx.beginPath();

    ctx.moveTo(550,150);

    ctx.lineTo(730,60);

    ctx.lineTo(910,150);

    ctx.closePath();

    ctx.fill();


    /* WINDOW */

    ctx.fillStyle = "#9DD7E8";

    ctx.fillRect(
        680,
        190,
        70,
        60
    );

    ctx.strokeStyle = "#5A4A42";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        680,
        190,
        70,
        60
    );


    /* PATH */

    ctx.fillStyle = "#D5B98A";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        80
    );


    /* FLOWERS */

    drawFlower(100,350);

    drawFlower(150,340);

    drawFlower(500,350);

    drawFlower(550,360);


    /* GIFT */

    drawGiftBasket();

}


/* =========================================
   CLOUD
========================================= */

function drawCloud(x,y) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 30,
        y - 10,
        30,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 60,
        y,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   FLOWER
========================================= */

function drawFlower(x,y) {

    ctx.fillStyle = "#3D8032";

    ctx.fillRect(
        x,
        y,
        4,
        20
    );


    ctx.fillStyle = "#FF6FAE";

    ctx.beginPath();

    ctx.arc(
        x + 2,
        y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   SIGN
========================================= */

function drawFirstMeetingSign() {

    ctx.fillStyle = "#8E405D";

    ctx.fillRect(
        680,
        235,
        190,
        90
    );


    ctx.fillStyle = "#69452E";

    ctx.fillRect(
        770,
        325,
        12,
        75
    );


    ctx.fillStyle = "white";

    ctx.font =
        "bold 24px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "FIRST MEETING ❤️",
        775,
        290
    );

}


/* =========================================
   GIFT BASKET
========================================= */

function drawGiftBasket() {

    const x = 760;
    const y = 365;


    /* BASKET */

    ctx.fillStyle = "#A96F3B";

    ctx.fillRect(
        x,
        y,
        70,
        45
    );


    /* TOP */

    ctx.fillStyle = "#C58A4C";

    ctx.fillRect(
        x - 5,
        y,
        80,
        10
    );


    /* HANDLE */

    ctx.strokeStyle = "#8A572D";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.arc(
        x + 35,
        y,
        28,
        Math.PI,
        0
    );

    ctx.stroke();


    /* RIBBON */

    ctx.fillStyle = "#E85D75";

    ctx.fillRect(
        x + 28,
        y - 5,
        14,
        20
    );


    ctx.fillStyle = "white";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "FOR HER ❤️",
        x + 35,
        y + 65
    );

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer() {

    /* BODY */

    ctx.fillStyle = "#3155A6";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /* HEAD */

    ctx.fillStyle = "#F1C29B";

    ctx.fillRect(
        player.x + 5,
        player.y - 20,
        22,
        22
    );


    /* HAIR */

    ctx.fillStyle = "#4A2C20";

    ctx.fillRect(
        player.x + 4,
        player.y - 23,
        24,
        8
    );


    /* EYES */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        player.x + 10,
        player.y - 14,
        3,
        3
    );

    ctx.fillRect(
        player.x + 20,
        player.y - 14,
        3,
        3
    );

}


/* =========================================
   PLAYER MOVEMENT
========================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (dialogueActive) {
        return;
    }


    /* LEFT */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.x -= player.speed;

    }


    /* RIGHT */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.x += player.speed;

    }


    /* LIMIT */

    player.x =
        Math.max(
            0,
            Math.min(
                canvas.width - player.width,
                player.x
            )
        );


    /* PATH */

    player.y = 390;


    /* =====================================
       CHAPTER 1 TRIGGER
    ===================================== */

    if (currentChapter === 1) {

        const signX = 775;

        const playerCenter =
            player.x +
            player.width / 2;

        const distance =
            Math.abs(
                playerCenter - signX
            );


        if (
            distance < 100 &&
            !firstMeetingTriggered
        ) {

            firstMeetingTriggered = true;

            startDialogue(
                chapters.firstMeeting.dialogue
            );

        }

    }


    /* =====================================
       CHAPTER 2 TRIGGER
    ===================================== */

    if (currentChapter === 2) {

        const basketX = 795;

        const playerCenter =
            player.x +
            player.width / 2;

        const distance =
            Math.abs(
                playerCenter - basketX
            );


        if (
            distance < 100 &&
            !girlfriendQuestionTriggered
        ) {

            girlfriendQuestionTriggered = true;

            startDialogue(
                chapters.girlfriendQuestion.dialogue
            );

        }

    }

}


/* =========================================
   CONTINUE BUTTON
========================================= */

continueButton.addEventListener(
    "click",
    function() {

        if (dialogueActive) {

            nextDialogue();

        }

    }
);


/* =========================================
   GAME LOOP
========================================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    updatePlayer();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================
   START
========================================= */

gameLoop();

</script>

</body>

</html>

    min-height: 55px;
}

#continueButton {
    margin-top: 12px;
    padding: 8px 16px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-family: Georgia, serif;
}

.hidden {
    display: none !important;
}

</style>

</head>


<body>

<div id="game">

    <canvas
        id="gameCanvas"
        width="960"
        height="540">
    </canvas>


    <!-- TITLE SCREEN -->

    <div id="titleScreen">

        <h1>
            Our Little Adventure ❤️
        </h1>

        <p>
            A very small game about a very big story.
        </p>

        <button id="startButton">
            Start Adventure
        </button>

    </div>


    <!-- CHAPTER TITLE -->

    <div
        id="chapterTitle"
        class="chapterHidden">

        <div id="chapterNumber">
            CHAPTER 1
        </div>

        <div id="chapterName">
            The Beginning
        </div>

    </div>


    <!-- DIALOGUE -->

    <div
        id="dialogue"
        class="hidden">

        <div id="speaker"></div>

        <div id="dialogueText"></div>

        <button id="continueButton">
            Continue ❤️
        </button>

    </div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================================
   UI ELEMENTS
========================================= */

const titleScreen =
    document.getElementById("titleScreen");

const startButton =
    document.getElementById("startButton");

const dialogueBox =
    document.getElementById("dialogue");

const speakerElement =
    document.getElementById("speaker");

const dialogueTextElement =
    document.getElementById("dialogueText");

const continueButton =
    document.getElementById("continueButton");

const chapterTitle =
    document.getElementById("chapterTitle");

const chapterNumber =
    document.getElementById("chapterNumber");

const chapterName =
    document.getElementById("chapterName");


/* =========================================
   GAME STATE
========================================= */

let gameStarted = false;

let dialogueActive = false;

let currentDialogue = 0;

let currentChapter = 1;

let firstMeetingTriggered = false;

let girlfriendQuestionTriggered = false;


/* =========================================
   PLAYER
========================================= */

const player = {

    x: 180,

    y: 390,

    width: 32,

    height: 44,

    speed: 4

};


/* =========================================
   KEYBOARD
========================================= */

const keys = {};


document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;


        if (
            dialogueActive &&
            (
                event.key === " " ||
                event.key === "Enter"
            )
        ) {

            nextDialogue();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================================
   STORY
========================================= */

const chapters = {

    /* =====================================
       CHAPTER 1
    ===================================== */

    firstMeeting: {

        title: "The Beginning",

        dialogue: [

            {
                speaker: "Narrator",
                text:
                    "It started with two people who had never met."
            },

            {
                speaker: "Narrator",
                text:
                    "Then, one day... they matched on Hinge."
            },

            {
                speaker: "Cooper",
                text:
                    "Want to go on a date?"
            },

            {
                speaker: "Her",
                text:
                    "Sure! ❤️"
            },

            {
                speaker: "Her (secretly)",
                text:
                    "Please cancel. Please cancel. Please cancel. 😂"
            },

            {
                speaker: "Narrator",
                text:
                    "But he didn't cancel."
            },

            {
                speaker: "Narrator",
                text:
                    "And neither did she."
            },

            {
                speaker: "Narrator",
                text:
                    "So they went on their first date..."
            },

            {
                speaker: "Narrator",
                text:
                    "...and somehow, things started going really well."
            },

            {
                speaker: "Narrator",
                text:
                    "Neither of them knew it yet..."
            },

            {
                speaker: "Narrator",
                text:
                    "but this was only the beginning."
            }

        ]

    },


    /* =====================================
       CHAPTER 2
    ===================================== */

    girlfriendQuestion: {

        title: "The Question",

        dialogue: [

            {
                speaker: "Narrator",
                text:
                    "A little time passed..."
            },

            {
                speaker: "Narrator",
                text:
                    "And Cooper realized there was something he wanted to ask."
            },

            {
                speaker: "Narrator",
                text:
                    "So, one early morning..."
            },

            {
                speaker: "Narrator",
                text:
                    "he quietly made his way into her backyard."
            },

            {
                speaker: "Narrator",
                text:
                    "He wasn't empty-handed, either."
            },

            {
                speaker: "Cooper",
                text:
                    "Okay... I hope she likes this."
            },

            {
                speaker: "Narrator",
                text:
                    "He brought her a gift basket."
            },

            {
                speaker: "Narrator",
                text:
                    "Now there was only one thing left to do."
            },

            {
                speaker: "Cooper",
                text:
                    "Hey..."
            },

            {
                speaker: "Her",
                text:
                    "What are you doing here so early? 😂"
            },

            {
                speaker: "Cooper",
                text:
                    "I wanted to give you something."
            },

            {
                speaker: "Her",
                text:
                    "Aww... what's this? ❤️"
            },

            {
                speaker: "Cooper",
                text:
                    "There's something else I wanted to ask you."
            },

            {
                speaker: "Her",
                text:
                    "What?"
            },

            {
                speaker: "Cooper",
                text:
                    "Will you be my girlfriend?"
            },

            {
                speaker: "Her",
                text:
                    "Yes. ❤️"
            },

            {
                speaker: "Narrator",
                text:
                    "And just like that..."
            },

            {
                speaker: "Narrator",
                text:
                    "they became something more."
            },

            {
                speaker: "Narrator",
                text:
                    "But their story was only getting started."
            }

        ]

    }

};


/* =========================================
   START GAME
========================================= */

startButton.addEventListener(
    "click",
    function() {

        titleScreen.classList.add("hidden");

        gameStarted = true;

        currentChapter = 1;

        player.x = 180;

        showChapter(
            "CHAPTER 1",
            "The Beginning"
        );

    }
);


/* =========================================
   CHAPTER TITLE
========================================= */

function showChapter(number, name) {

    chapterNumber.textContent = number;

    chapterName.textContent = name;

    chapterTitle.classList.remove(
        "chapterHidden"
    );


    setTimeout(
        function() {

            chapterTitle.classList.add(
                "chapterHidden"
            );

        },
        2500
    );

}


/* =========================================
   DIALOGUE
========================================= */

function startDialogue(dialogue) {

    if (dialogueActive) {

        return;

    }

    dialogueActive = true;

    currentDialogue = 0;

    dialogueBox.classList.remove(
        "hidden"
    );

    displayDialogue(
        dialogue[0]
    );

}


function displayDialogue(line) {

    speakerElement.textContent =
        line.speaker;

    dialogueTextElement.textContent =
        line.text;

}


function nextDialogue() {

    currentDialogue++;


    /* =====================================
       CHAPTER 1 FINISHED
    ===================================== */

    if (
        currentChapter === 1 &&
        currentDialogue >=
        chapters.firstMeeting.dialogue.length
    ) {

        endDialogue();

        startChapter2();

        return;

    }


    /* =====================================
       CHAPTER 2 FINISHED
    ===================================== */

    if (
        currentChapter === 2 &&
        currentDialogue >=
        chapters.girlfriendQuestion.dialogue.length
    ) {

        endDialogue();

        return;

    }


    /* =====================================
       SHOW NEXT LINE
    ===================================== */

    if (currentChapter === 1) {

        displayDialogue(
            chapters.firstMeeting.dialogue[
                currentDialogue
            ]
        );

    }

    else if (currentChapter === 2) {

        displayDialogue(
            chapters.girlfriendQuestion.dialogue[
                currentDialogue
            ]
        );

    }

}


function endDialogue() {

    dialogueActive = false;

    dialogueBox.classList.add(
        "hidden"
    );

    currentDialogue = 0;

}


/* =========================================
   START CHAPTER 2
========================================= */

function startChapter2() {

    currentChapter = 2;

    firstMeetingTriggered = true;

    girlfriendQuestionTriggered = false;

    player.x = 180;

    showChapter(
        "CHAPTER 2",
        "The Question"
    );

}


/* =========================================
   DRAW BACKGROUND
========================================= */

function drawBackground() {

    /* =====================================
       CHAPTER 1 BACKGROUND
    ===================================== */

    if (currentChapter === 1) {

        drawChapter1Background();

    }


    /* =====================================
       CHAPTER 2 BACKGROUND
    ===================================== */

    else if (currentChapter === 2) {

        drawChapter2Background();

    }

}


/* =========================================
   CHAPTER 1 BACKGROUND
========================================= */

function drawChapter1Background() {

    /* SKY */

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        320
    );


    /* GRASS */

    ctx.fillStyle = "#65A854";

    ctx.fillRect(
        0,
        320,
        canvas.width,
        220
    );


    /* SUN */

    ctx.fillStyle = "#FFD966";

    ctx.beginPath();

    ctx.arc(
        820,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CLOUDS */

    drawCloud(150, 90);

    drawCloud(450, 130);

    drawCloud(700, 60);


    /* PATH */

    ctx.fillStyle = "#D5B98A";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        80
    );


    /* FLOWERS */

    drawFlower(100, 340);

    drawFlower(130, 355);

    drawFlower(750, 350);

    drawFlower(800, 330);

    drawFlower(870, 360);


    /* SIGN */

    drawFirstMeetingSign();

}


/* =========================================
   CHAPTER 2 BACKGROUND
========================================= */

function drawChapter2Background() {

    /* MORNING SKY */

    ctx.fillStyle = "#F7CFA5";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        320
    );


    /* MORNING LIGHT */

    ctx.fillStyle = "#FFD98A";

    ctx.beginPath();

    ctx.arc(
        760,
        100,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* GRASS */

    ctx.fillStyle = "#5E984D";

    ctx.fillRect(
        0,
        320,
        canvas.width,
        220
    );


    /* BACKYARD FENCE */

    ctx.fillStyle = "#D6B27C";

    for (
        let x = 0;
        x < canvas.width;
        x += 45
    ) {

        ctx.fillRect(
            x,
            250,
            32,
            110
        );

    }


    ctx.fillStyle = "#B58D5E";

    ctx.fillRect(
        0,
        250,
        canvas.width,
        12
    );

    ctx.fillRect(
        0,
        310,
        canvas.width,
        12
    );


    /* HOUSE */

    ctx.fillStyle = "#F2E1C9";

    ctx.fillRect(
        590,
        150,
        280,
        180
    );


    /* ROOF */

    ctx.fillStyle = "#7D4F50";

    ctx.beginPath();

    ctx.moveTo(550, 150);

    ctx.lineTo(730, 60);

    ctx.lineTo(910, 150);

    ctx.closePath();

    ctx.fill();


    /* WINDOW */

    ctx.fillStyle = "#9DD7E8";

    ctx.fillRect(
        680,
        190,
        70,
        60
    );

    ctx.strokeStyle = "#5A4A42";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        680,
        190,
        70,
        60
    );

    ctx.beginPath();

    ctx.moveTo(715, 190);
    ctx.lineTo(715, 250);

    ctx.moveTo(680, 220);
    ctx.lineTo(750, 220);

    ctx.stroke();


    /* BACKYARD PATH */

    ctx.fillStyle = "#D5B98A";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        80
    );


    /* FLOWERS */

    drawFlower(100, 350);

    drawFlower(150, 340);

    drawFlower(500, 350);

    drawFlower(550, 360);


    /* GIFT BASKET */

    drawGiftBasket();

}


/* =========================================
   CLOUD
========================================= */

function drawCloud(x, y) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 30,
        y - 10,
        30,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 60,
        y,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   FLOWER
========================================= */

function drawFlower(x, y) {

    ctx.fillStyle = "#3D8032";

    ctx.fillRect(
        x,
        y,
        4,
        20
    );

    ctx.fillStyle = "#FF6FAE";

    ctx.beginPath();

    ctx.arc(
        x + 2,
        y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   FIRST MEETING SIGN
========================================= */

function drawFirstMeetingSign() {

    ctx.fillStyle = "#8E405D";

    ctx.fillRect(
        680,
        235,
        190,
        90
    );


    ctx.fillStyle = "#69452E";

    ctx.fillRect(
        770,
        325,
        12,
        75
    );


    ctx.fillStyle = "white";

    ctx.font =
        "bold 24px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "FIRST MEETING ❤️",
        775,
        290
    );

}


/* =========================================
   GIFT BASKET
========================================= */

function drawGiftBasket() {

    const x = 760;
    const y = 365;


    /* BASKET */

    ctx.fillStyle = "#A96F3B";

    ctx.fillRect(
        x,
        y,
        70,
        45
    );


    /* BASKET TOP */

    ctx.fillStyle = "#C58A4C";

    ctx.fillRect(
        x - 5,
        y,
        80,
        10
    );


    /* HANDLE */

    ctx.strokeStyle = "#8A572D";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.arc(
        x + 35,
        y,
        28,
        Math.PI,
        0
    );

    ctx.stroke();


    /* RIBBON */

    ctx.fillStyle = "#E85D75";

    ctx.fillRect(
        x + 28,
        y - 5,
        14,
        20
    );


    ctx.beginPath();

    ctx.moveTo(x + 35, y + 10);

    ctx.lineTo(x + 18, y + 25);

    ctx.lineTo(x + 35, y + 20);

    ctx.lineTo(x + 52, y + 25);

    ctx.closePath();

    ctx.fill();


    /* LABEL */

    ctx.fillStyle = "white";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "FOR HER ❤️",
        x + 35,
        y + 65
    );

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer() {

    /* BODY */

    ctx.fillStyle = "#3155A6";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /* HEAD */

    ctx.fillStyle = "#F1C29B";

    ctx.fillRect(
        player.x + 5,
        player.y - 20,
        22,
        22
    );


    /* HAIR */

    ctx.fillStyle = "#4A2C20";

    ctx.fillRect(
        player.x + 4,
        player.y - 23,
        24,
        8
    );


    /* EYES */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        player.x + 10,
        player.y - 14,
        3,
        3
    );

    ctx.fillRect(
        player.x + 20,
        player.y - 14,
        3,
        3
    );

}


/* =========================================
   PLAYER MOVEMENT
========================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (dialogueActive) {
        return;
    }


    /* LEFT */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.x -= player.speed;

    }


    /* RIGHT */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.x += player.speed;

    }


    /* SCREEN LIMITS */

    player.x =
        Math.max(
            0,
            Math.min(
                canvas.width - player.width,
                player.x
            )
        );


    /* KEEP PLAYER ON PATH */

    player.y = 390;


    /* =====================================
       CHAPTER 1 INTERACTION
    ===================================== */

    if (currentChapter === 1) {

        const firstMeetingX = 775;

        const playerCenter =
            player.x + player.width / 2;

        const distance =
            Math.abs(
                playerCenter -
                firstMeetingX
            );


        if (distance < 100) {

            if (!firstMeetingTriggered) {

                firstMeetingTriggered = true;

                startDialogue(
                    chapters.firstMeeting.dialogue
                );

            }

        }

    }


    /* =====================================
       CHAPTER 2 INTERACTION
    ===================================== */

    if (currentChapter === 2) {

        const giftBasketX = 795;

        const playerCenter =
            player.x + player.width / 2;

        const distance =
            Math.abs(
                playerCenter -
                giftBasketX
            );


        if (distance < 100) {

            if (!girlfriendQuestionTriggered) {

                girlfriendQuestionTriggered = true;

                startDialogue(
                    chapters.girlfriendQuestion.dialogue
                );

            }

        }

    }

}


/* =========================================
   CONTINUE BUTTON
========================================= */

continueButton.addEventListener(
    "click",
    function() {

        if (dialogueActive) {

            nextDialogue();

        }

    }
);


/* =========================================
   GAME LOOP
========================================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    updatePlayer();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================
   START LOOP
========================================= */

gameLoop();

</script>

</body>

</html>
