<!DOCTYPE html>
<html lang="en">

<head> 

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Our Little Adventure ❤️</title>


<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111;

    color: white;

    font-family: Georgia, serif;

    display: flex;

    justify-content: center;

    align-items: center;

    width: 100vw;

    height: 100vh;

    overflow: hidden;
}


/* =========================================
   GAME
========================================= */

#game {

    position: relative;

    width: 960px;

    height: 540px;

    max-width: 100vw;

    max-height: 100vh;

    overflow: hidden;

    background: #87CEEB;
}


/* =========================================
   CANVAS
========================================= */

canvas {

    display: block;

    width: 100%;

    height: 100%;

    image-rendering: pixelated;
}


/* =========================================
   TITLE SCREEN
========================================= */

#titleScreen {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            rgba(20, 20, 40, 0.35),
            rgba(20, 20, 40, 0.75)
        );

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 10;
}


#titleScreen h1 {

    font-size: 58px;

    margin: 0 0 10px 0;

    text-shadow:
        3px 3px 0 #000;
}


#titleScreen p {

    font-size: 20px;

    margin-bottom: 35px;
}


#startButton {

    padding: 14px 35px;

    border: none;

    border-radius: 10px;

    background: white;

    color: #222;

    font-family: Georgia, serif;

    font-size: 20px;

    cursor: pointer;

    transition: transform 0.15s;
}


#startButton:hover {

    transform: scale(1.08);
}


/* =========================================
   CHAPTER TITLE
========================================= */

#chapterTitle {

    position: absolute;

    top: 35%;

    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 8;

    pointer-events: none;

    text-shadow:
        3px 3px 0 #000;
}


#chapterNumber {

    font-size: 20px;
}


#chapterName {

    font-size: 50px;

    margin: 5px 0;
}


.chapterHidden {

    display: none;
}


/* =========================================
   DIALOGUE
========================================= */

#dialogue {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    width: 88%;

    padding: 18px 22px;

    background: rgba(15, 15, 25, 0.96);

    border: 3px solid white;

    border-radius: 12px;

    z-index: 20;
}


#speaker {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 8px;
}


#dialogueText {

    font-size: 19px;

    line-height: 1.45;

    min-height: 55px;
}


#continueButton {

    margin-top: 12px;

    padding: 8px 16px;

    border: none;

    border-radius: 7px;

    cursor: pointer;

    font-family: Georgia, serif;
}


.hidden {

    display: none !important;
}

</style>

</head>


<body>


<div id="game">


    <!-- GAME CANVAS -->

    <canvas
        id="gameCanvas"
        width="960"
        height="540">
    </canvas>


    <!-- TITLE SCREEN -->

    <div id="titleScreen">

        <h1>
            Our Little Adventure ❤️
        </h1>

        <p>
            A very small game about a very big story.
        </p>

        <button id="startButton">
            Start Adventure
        </button>

    </div>


    <!-- CHAPTER TITLE -->

    <div
        id="chapterTitle"
        class="chapterHidden">

        <div id="chapterNumber">
            CHAPTER 1
        </div>

        <div id="chapterName">
            The Beginning
        </div>

    </div>


    <!-- DIALOGUE -->

    <div
        id="dialogue"
        class="hidden">

        <div id="speaker"></div>

        <div id="dialogueText"></div>

        <button id="continueButton">
            Continue ❤️
        </button>

    </div>


</div>



<script>


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================================
   UI ELEMENTS
========================================= */

const titleScreen =
    document.getElementById("titleScreen");

const startButton =
    document.getElementById("startButton");

const dialogueBox =
    document.getElementById("dialogue");

const speakerElement =
    document.getElementById("speaker");

const dialogueTextElement =
    document.getElementById("dialogueText");

const continueButton =
    document.getElementById("continueButton");

const chapterTitle =
    document.getElementById("chapterTitle");

const chapterNumber =
    document.getElementById("chapterNumber");

const chapterName =
    document.getElementById("chapterName");


/* =========================================
   GAME STATE
========================================= */

let gameStarted = false;

let dialogueActive = false;

let currentDialogue = 0;

let firstMeetingTriggered = false;


/* =========================================
   PLAYER
========================================= */

const player = {

    x: 180,

    y: 390,

    width: 32,

    height: 44,

    speed: 4

};


/* =========================================
   KEYBOARD
========================================= */

const keys = {};


document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;


        /* Continue dialogue with
           Space or Enter */

        if (
            dialogueActive &&
            (
                event.key === " " ||
                event.key === "Enter"
            )
        ) {

            nextDialogue();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================================
   STORY
========================================= */

const chapters = {

    firstMeeting: {

        title: "The Beginning",

        dialogue: [

            {
                speaker: "Narrator",

                text:
                    "It started with two people who had never met."
            },

            {
                speaker: "Narrator",

                text:
                    "Then, one day... they matched on Hinge."
            },

            {
                speaker: "Cooper",

                text:
                    "Want to go on a date?"
            },

            {
                speaker: "Her",

                text:
                    "Sure! ❤️"
            },

            {
                speaker: "Her (secretly)",

                text:
                    "Please cancel. Please cancel. Please cancel. 😂"
            },

            {
                speaker: "Narrator",

                text:
                    "But he didn't cancel."
            },

            {
                speaker: "Narrator",

                text:
                    "And neither did she."
            },

            {
                speaker: "Narrator",

                text:
                    "So they went on their first date..."
            },

            {
                speaker: "Narrator",

                text:
                    "...and somehow, things started going really well."
            },

            {
                speaker: "Narrator",

                text:
                    "Neither of them knew it yet..."
            },

            {
                speaker: "Narrator",

                text:
                    "but this was only the beginning."
            }

        ]

    }

};


/* =========================================
   START GAME
========================================= */

startButton.addEventListener(
    "click",
    function() {

        titleScreen.classList.add("hidden");

        gameStarted = true;

        showChapter(
            "CHAPTER 1",
            "The Beginning"
        );

    }
);


/* =========================================
   CHAPTER TITLE
========================================= */

function showChapter(number, name) {

    chapterNumber.textContent = number;

    chapterName.textContent = name;

    chapterTitle.classList.remove(
        "chapterHidden"
    );


    setTimeout(
        function() {

            chapterTitle.classList.add(
                "chapterHidden"
            );

        },
        2500
    );

}


/* =========================================
   DIALOGUE
========================================= */

function startDialogue(dialogue) {

    if (dialogueActive) {

        return;

    }


    dialogueActive = true;

    currentDialogue = 0;


    dialogueBox.classList.remove(
        "hidden"
    );


    displayDialogue(
        dialogue[0]
    );

}


function displayDialogue(line) {

    speakerElement.textContent =
        line.speaker;

    dialogueTextElement.textContent =
        line.text;

}


function nextDialogue() {

    currentDialogue++;


    if (
        currentDialogue >=
        chapters.firstMeeting.dialogue.length
    ) {

        endDialogue();

        return;

    }


    displayDialogue(
        chapters.firstMeeting.dialogue[
            currentDialogue
        ]
    );

}


function endDialogue() {

    dialogueActive = false;

    dialogueBox.classList.add(
        "hidden"
    );

    currentDialogue = 0;

}


/* =========================================
   DRAW BACKGROUND
========================================= */

function drawBackground() {


    /* SKY */

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        320
    );


    /* GRASS */

    ctx.fillStyle = "#65A854";

    ctx.fillRect(
        0,
        320,
        canvas.width,
        220
    );


    /* SUN */

    ctx.fillStyle = "#FFD966";

    ctx.beginPath();

    ctx.arc(
        820,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CLOUDS */

    drawCloud(150, 90);

    drawCloud(450, 130);

    drawCloud(700, 60);


    /* PATH */

    ctx.fillStyle = "#D5B98A";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        80
    );


    /* FLOWERS */

    drawFlower(100, 340);

    drawFlower(130, 355);

    drawFlower(750, 350);

    drawFlower(800, 330);

    drawFlower(870, 360);


    /* FIRST MEETING SIGN */

    drawFirstMeetingSign();

}


/* =========================================
   CLOUD
========================================= */

function drawCloud(x, y) {

    ctx.fillStyle = "white";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 30,
        y - 10,
        30,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 60,
        y,
        25,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* =========================================
   FLOWER
========================================= */

function drawFlower(x, y) {


    /* STEM */

    ctx.fillStyle = "#3D8032";

    ctx.fillRect(
        x,
        y,
        4,
        20
    );


    /* FLOWER */

    ctx.fillStyle = "#FF6FAE";

    ctx.beginPath();

    ctx.arc(
        x + 2,
        y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   FIRST MEETING SIGN
========================================= */

function drawFirstMeetingSign() {


    /* SIGN */

    ctx.fillStyle = "#8E405D";

    ctx.fillRect(
        680,
        235,
        190,
        90
    );


    /* SIGN POST */

    ctx.fillStyle = "#69452E";

    ctx.fillRect(
        770,
        325,
        12,
        75
    );


    /* TEXT */

    ctx.fillStyle = "white";

    ctx.font =
        "bold 24px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "FIRST MEETING ❤️",
        775,
        290
    );

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer() {


    /* BODY */

    ctx.fillStyle = "#3155A6";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /* HEAD */

    ctx.fillStyle = "#F1C29B";

    ctx.fillRect(
        player.x + 5,
        player.y - 20,
        22,
        22
    );


    /* HAIR */

    ctx.fillStyle = "#4A2C20";

    ctx.fillRect(
        player.x + 4,
        player.y - 23,
        24,
        8
    );


    /* EYES */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        player.x + 10,
        player.y - 14,
        3,
        3
    );


    ctx.fillRect(
        player.x + 20,
        player.y - 14,
        3,
        3
    );

}


/* =========================================
   PLAYER MOVEMENT
========================================= */

function updatePlayer() {


    if (!gameStarted) {

        return;

    }


    if (dialogueActive) {

        return;

    }


    /* =====================================
       LEFT
    ===================================== */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.x -= player.speed;

    }


    /* =====================================
       RIGHT
    ===================================== */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.x += player.speed;

    }


    /* =====================================
       SCREEN LIMITS
    ===================================== */

    player.x =
        Math.max(
            0,
            Math.min(
                canvas.width -
                player.width,
                player.x
            )
        );


    /* =====================================
       KEEP PLAYER ON PATH
    ===================================== */

    player.y = 390;


    /* =====================================
       FIRST MEETING INTERACTION
    ===================================== */

    const firstMeetingX = 775;

    const playerCenter =
        player.x + player.width / 2;

    const distance =
        Math.abs(
            playerCenter -
            firstMeetingX
        );


    if (distance < 100) {

        if (!firstMeetingTriggered) {

            firstMeetingTriggered = true;

            startDialogue(
                chapters.firstMeeting.dialogue
            );

        }

    }

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop() {


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    updatePlayer();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================
   START LOOP
========================================= */

gameLoop();

</script>

</body>

</html>
```
