/* =========================================================
   GET CURRENT DIALOGUE
========================================================= */

function getCurrentDialogue() {

    if (currentChapter === 1) {

        return chapters.firstMeeting;

    }

    if (currentChapter === 2) {

        return chapters.girlfriendQuestion;

    }

    if (currentChapter === 3) {

        return chapters.pittsburgh;

    }

    if (currentChapter === 4) {

        return chapters.wedding;

    }

    return [];

}


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener("click", startGame);


function startGame() {

    gameStarted = true;

    titleScreen.classList.add("hidden");

    currentChapter = 1;

    currentDialogue = 0;

    firstMeetingTriggered = false;

    girlfriendQuestionTriggered = false;

    airportTriggered = false;

    weddingTriggered = false;

    player.x = 180;

    showChapter(
        "CHAPTER 1",
        "The Beginning"
    );

}


/* =========================================================
   SHOW CHAPTER TITLE
========================================================= */

function showChapter(title, subtitle) {

    chapterTitleText.textContent = title;

    chapterSubtitle.textContent = subtitle;

    chapterTitle.classList.remove("hidden");

    setTimeout(() => {

        chapterTitle.classList.add("hidden");

    }, 3000);

}


/* =========================================================
   START DIALOGUE
========================================================= */

function startDialogue() {

    if (dialogueActive) {
        return;
    }

    dialogueActive = true;

    currentDialogue = 0;

    dialogueBox.classList.remove("hidden");

    displayDialogue(
        getCurrentDialogue()[currentDialogue]
    );

}


/* =========================================================
   DISPLAY DIALOGUE
========================================================= */

function displayDialogue(dialogue) {

    if (!dialogue) {
        return;
    }

    speakerElement.textContent = dialogue.speaker;

    dialogueTextElement.textContent = dialogue.text;

}


/* =========================================================
   NEXT DIALOGUE
========================================================= */

function nextDialogue() {

    if (!dialogueActive) {
        return;
    }

    const dialogue = getCurrentDialogue();

    currentDialogue++;

    if (currentDialogue >= dialogue.length) {

        endDialogue();

        return;

    }

    displayDialogue(
        dialogue[currentDialogue]
    );

}


/* =========================================================
   END DIALOGUE
========================================================= */

function endDialogue() {

    dialogueActive = false;

    dialogueBox.classList.add("hidden");

    currentDialogue = 0;


    /* =====================================================
       CHAPTER 1 → CHAPTER 2
    ===================================================== */

    if (currentChapter === 1) {

        currentChapter = 2;

        player.x = 150;

        girlfriendQuestionTriggered = false;

        showChapter(
            "CHAPTER 2",
            "The Question"
        );

        return;
    }


    /* =====================================================
       CHAPTER 2 → CHAPTER 3
    ===================================================== */

    if (currentChapter === 2) {

        currentChapter = 3;

        player.x = 150;

        airportTriggered = false;

        showChapter(
            "CHAPTER 3",
            "The Big Decision"
        );

        return;
    }


    /* =====================================================
       CHAPTER 3 → CHAPTER 4
    ===================================================== */

    if (currentChapter === 3) {

        currentChapter = 4;

        player.x = 150;

        weddingTriggered = false;

        showChapter(
            "CHAPTER 4",
            "The Wedding"
        );

        return;
    }


    /* =====================================================
       CHAPTER 4 END
    ===================================================== */

    if (currentChapter === 4) {

        showChapter(
            "WE'RE MARRIED ❤️",
            "Forever Starts Here"
        );

        return;
    }

}


/* =========================================================

========================================================= */

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;


    if (
        event.code === "Space" ||
        event.code === "Enter"
    ) {

        if (dialogueActive) {

            event.preventDefault();

            nextDialogue();

        }

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (dialogueActive) {
        return;
    }


    /* Move right */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.x += player.speed;

    }


    /* Move left */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.x -= player.speed;

    }


    /* Keep player inside screen */

    if (player.x < 20) {

        player.x = 20;

    }

    if (player.x > 900) {

        player.x = 900;

    }


    /* =====================================================
       CHAPTER 1 TRIGGER
    ===================================================== */

    if (currentChapter === 1) {

        if (
            !firstMeetingTriggered &&
            player.x > 720
        ) {

            firstMeetingTriggered = true;

            startDialogue();

        }

    }


    /* =====================================================
       CHAPTER 2 TRIGGER
    ===================================================== */

    if (currentChapter === 2) {

        if (
            !girlfriendQuestionTriggered &&
            player.x > 700
        ) {

            girlfriendQuestionTriggered = true;

            startDialogue();

        }

    }


    /* =====================================================
       CHAPTER 3 TRIGGER
    ===================================================== */

    if (currentChapter === 3) {

        if (
            !airportTriggered &&
            player.x > 700
        ) {

            airportTriggered = true;

            startDialogue();

        }

    }


    /* =====================================================
       CHAPTER 4 TRIGGER
    ===================================================== */

    if (currentChapter === 4) {

        if (
            !weddingTriggered &&
            player.x > 700
        ) {

            weddingTriggered = true;

            startDialogue();

        }

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x = player.x;

    const y = player.y;


    /* Body */

    ctx.fillStyle = "#3f6fd9";

    ctx.fillRect(
        x,
        y + 15,
        player.width,
        29
    );


    /* Head */

    ctx.fillStyle = "#ffd0a6";

    ctx.beginPath();

    ctx.arc(
        x + 16,
        y + 10,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle = "#4b2d1f";

    ctx.beginPath();

    ctx.arc(
        x + 16,
        y + 7,
        12,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Legs */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        x + 4,
        y + 40,
        9,
        4
    );

    ctx.fillRect(
        x + 20,
        y + 40,
        9,
        4
    );

}

function drawWeddingArch(x, y) {

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 12;

    ctx.moveTo(
        x - 110,

    ctx.lineTo(
        x - 110,
        y - 100

    ctx.quadraticCurveTo(
        x,
        y - 220,
        x + 110,
        y - 100
    );

    ctx.lineTo(
        x + 110,
        y + 40
    );

    ctx.stroke();


    /* Flowers */

    drawArchFlower(x - 105, y - 85);

    drawArchFlower(x - 85, y - 120);

    drawArchFlower(x - 55, y - 145);

    drawArchFlower(x - 25, y - 160);

    drawArchFlower(x, y - 165);

    drawArchFlower(x + 25, y - 160);

    drawArchFlower(x + 55, y - 145);

    drawArchFlower(x + 85, y - 120);

    drawArchFlower(x + 105, y - 85);

}
