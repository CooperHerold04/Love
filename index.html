<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Adventure ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

#gameContainer {
    position: relative;

    width: 960px;
    height: 540px;

    overflow: hidden;

    background: #87ceeb;
}

canvas {
    display: block;

    width: 960px;
    height: 540px;
}

/* ---------------- TITLE SCREEN ---------------- */

#titleScreen {
    position: absolute;

    inset: 0;

    background: linear-gradient(#87ceeb, #bdefff);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;
}

#titleScreen h1 {
    font-size: 48px;

    margin: 0 0 10px 0;

    color: white;

    text-shadow: 3px 3px #555;
}

#titleScreen p {
    font-size: 22px;

    margin-bottom: 30px;
}

#startButton {
    padding: 15px 30px;

    font-size: 20px;

    border: none;

    border-radius: 12px;

    background: #ff6f91;

    color: white;

    cursor: pointer;

    box-shadow: 0 4px 0 #c94f6e;
}

#startButton:hover {
    background: #ff557e;
}

#startButton:active {
    transform: translateY(3px);

    box-shadow: 0 1px 0 #c94f6e;
}

/* ---------------- CHAPTER TITLE ---------------- */

#chapterTitle {
    position: absolute;

    inset: 0;

    background: rgba(0,0,0,.65);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 8;
}

#chapterTitle h2 {
    font-size: 48px;

    margin: 0;
}

#chapterTitle p {
    font-size: 25px;

    margin-top: 10px;
}

/* ---------------- DIALOGUE ---------------- */

#dialogueBox {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 880px;

    background: rgba(0,0,0,.82);

    border: 3px solid white;

    border-radius: 12px;

    padding: 18px 22px;

    z-index: 7;
}

#speaker {
    display: block !important;

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 8px;

    color: #ffb6c9;
}

#dialogueText {
    font-size: 19px;

    line-height: 1.4;

    min-height: 55px;
}

#continueText {
    text-align: right;

    font-size: 14px;

    color: #ccc;

    margin-top: 8px;
}

/* ---------------- CONTROLS ---------------- */

#controls {
    position: absolute;

    top: 12px;
    left: 12px;

    background: rgba(0,0,0,.45);

    padding: 8px 12px;

    border-radius: 8px;

    font-size: 14px;

    z-index: 5;
}

/* ---------------- HIDDEN ---------------- */

.hidden {
    display: none !important;
}

</style>
</head>


<body>

<div id="gameContainer">

    <canvas id="gameCanvas" width="960" height="540"></canvas>


    <!-- TITLE SCREEN -->

    <div id="titleScreen">

        <h1>Our Little Adventure ❤️</h1>

        <p>A story about us</p>

        <button id="startButton">
            Start Our Story
        </button>

    </div>


    <!-- CHAPTER TITLE -->

    <div id="chapterTitle" class="hidden">

        <h2 id="chapterTitleText"></h2>

        <p id="chapterSubtitle"></p>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        ← → or A / D to move

    </div>


    <!-- DIALOGUE -->

    <div id="dialogueBox" class="hidden">

        <div id="speaker"></div>

        <div id="dialogueText"></div>

        <div id="continueText">
            Press SPACE or ENTER
        </div>

    </div>

</div>


<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d");

const titleScreen = document.getElementById("titleScreen");

const startButton = document.getElementById("startButton");

const chapterTitle = document.getElementById("chapterTitle");

const chapterTitleText =
    document.getElementById("chapterTitleText");

const chapterSubtitle =
    document.getElementById("chapterSubtitle");

const dialogueBox =
    document.getElementById("dialogueBox");

const speakerElement =
    document.getElementById("speaker");

const dialogueTextElement =
    document.getElementById("dialogueText");


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

let currentChapter = 0;

let currentDialogue = 0;

let showingDialogue = false;

let chapterTitleTimer = null;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 120,

    y: 400,

    width: 40,

    height: 60,

    speed: 5

};


const keys = {

    left: false,

    right: false

};


/* =========================================================
   CHAPTERS
========================================================= */

const chapters = {

    /* -----------------------------------------------------
       CHAPTER 1
    ----------------------------------------------------- */

    firstMeeting: [

        {
            speaker: "Cooper",
            text: "I still remember the first time we met."
        },

        {
            speaker: "Cooper",
            text: "At the time, I had no idea how important that day would become."
        },

        {
            speaker: "Alyssa",
            text: "Neither did I."
        },

        {
            speaker: "Cooper",
            text: "But something about Alyssa immediately felt different."
        },

        {
            speaker: "Alyssa",
            text: "And somehow, we kept talking."
        },

        {
            speaker: "Cooper",
            text: "One conversation became another."
        },

        {
            speaker: "Cooper",
            text: "And before I knew it, I was looking forward to talking to Alyssa every day."
        },

        {
            speaker: "Alyssa",
            text: "Things were starting to feel pretty special."
        },

        {
            speaker: "Cooper",
            text: "I didn't know where our story would take us."
        },

        {
            speaker: "Cooper",
            text: "But I knew I wanted to find out."
        },

        {
            speaker: "Cooper",
            text: "And that was only the beginning."
        }

    ],


    /* -----------------------------------------------------
       CHAPTER 2
    ----------------------------------------------------- */

    girlfriendQuestion: [

        {
            speaker: "Cooper",
            text: "One early morning, I had a little surprise planned."
        },

        {
            speaker: "Cooper",
            text: "I quietly made my way into Alyssa's backyard with a gift basket."
        },

        {
            speaker: "Cooper",
            text: "I was nervous, but I knew what I wanted to ask."
        },

        {
            speaker: "Cooper",
            text: "Alyssa, would you be my girlfriend?"
        },

        {
            speaker: "Alyssa",
            text: "Of course."
        },

        {
            speaker: "Cooper",
            text: "And just like that, we officially became us."
        },

        {
            speaker: "Cooper",
            text: "I don't think either of us knew just how much that little question would change our lives."
        },

        {
            speaker: "Cooper",
            text: "But I wouldn't change a thing."
        }

    ],


    /* -----------------------------------------------------
       CHAPTER 3
    ----------------------------------------------------- */

    pittsburgh: [

        {
            speaker: "Cooper",
            text: "Then came the time when Alyssa had to fly to Pittsburgh to visit Alyssa's sister."
        },

        {
            speaker: "Cooper",
            text: "Saying goodbye wasn't easy."
        },

        {
            speaker: "Alyssa",
            text: "I didn't want to leave."
        },

        {
            speaker: "Cooper",
            text: "Neither did I want Alyssa to go."
        },

        {
            speaker: "Cooper",
            text: "Being apart made us realize just how much we wanted to be together."
        },

        {
            speaker: "Alyssa",
            text: "We didn't want to keep living so far apart."
        },

        {
            speaker: "Cooper",
            text: "We started talking about what our future could look like."
        },

        {
            speaker: "Cooper",
            text: "And eventually, we made a pretty big decision."
        },

        {
            speaker: "Alyssa",
            text: "We decided to get married."
        },

        {
            speaker: "Cooper",
            text: "It was scary, exciting, and completely worth it."
        },

        {
            speaker: "Cooper",
            text: "Because we knew we wanted to build our life together."
        }

    ],


    /* -----------------------------------------------------
       CHAPTER 4
    ----------------------------------------------------- */

    wedding: [

        {
            speaker: "Cooper",
            text: "And then came the day we had been waiting for."
        },

        {
            speaker: "Cooper",
            text: "Our wedding."
        },

        {
            speaker: "Cooper",
            text: "It happened right here in the same backyard where I once asked Alyssa to be my girlfriend."
        },

        {
            speaker: "Cooper",
            text: "This time, we weren't starting a relationship."
        },

        {
            speaker: "Cooper",
            text: "We were starting our marriage."
        },

        {
            speaker: "Cooper",
            text: "Alyssa's cousin, Alyssa's cousin's husband, Alyssa's cousin's child, our friends, and Alyssa's mom were all there watching through FaceTime."
        },

        {
            speaker: "Alyssa",
            text: "I can't believe we're actually married."
        },

        {
            speaker: "Cooper",
            text: "Neither can I."
        },

        {
            speaker: "Cooper",
            text: "But I know one thing."
        },

        {
            speaker: "Cooper",
            text: "I want to spend the rest of my life with Alyssa."
        },

        {
            speaker: "Cooper",
            text: "Forever starts here."
        }

    ],


    /* -----------------------------------------------------
       CHAPTER 5
    ----------------------------------------------------- */

    distance: [

        {
            speaker: "Cooper",
            text: "And now, here we are."
        },

        {
            speaker: "Cooper",
            text: "Even after everything we've been through, sometimes we're still far apart."
        },

        {
            speaker: "Alyssa",
            text: "I miss you."
        },

        {
            speaker: "Cooper",
            text: "I miss you too, Alyssa."
        },

        {
            speaker: "Cooper",
            text: "I know things are hard right now."
        },

        {
            speaker: "Alyssa",
            text: "Some days are harder than others."
        },

        {
            speaker: "Cooper",
            text: "There are days when I wish I could just reach through this screen and hold Alyssa."
        },

        {
            speaker: "Cooper",
            text: "But even when the distance feels impossible, I know Alyssa and I are going to get through it."
        },

        {
            speaker: "Alyssa",
            text: "You really think we can?"
        },

        {
            speaker: "Cooper",
            text: "I know we can."
        },

        {
            speaker: "Cooper",
            text: "We've already made it through so much."
        },

        {
            speaker: "Cooper",
            text: "This is just another part of our story."
        },

        {
            speaker: "Cooper",
            text: "No matter how hard it gets, I'm not going anywhere."
        },

        {
            speaker: "Cooper",
            text: "We'll get through the distance."
        },

        {
            speaker: "Cooper",
            text: "We'll get through the hard days."
        },

        {
            speaker: "Cooper",
            text: "And one day, we won't have to say goodbye anymore."
        },

        {
            speaker: "Cooper",
            text: "Until then, I'll keep choosing Alyssa."
        },

        {
            speaker: "Cooper",
            text: "I love you, Alyssa. ❤️"
        }

    ]

};


/* =========================================================
   CHAPTER INFORMATION
========================================================= */

const chapterInfo = [

    {
        name: "The First Meeting",
        subtitle: "Where our story began."
    },

    {
        name: "The Question",
        subtitle: "The day we became us."
    },

    {
        name: "A Little Distance",
        subtitle: "Sometimes being apart makes you realize what matters most."
    },

    {
        name: "Our Wedding",
        subtitle: "The beginning of forever."
    },

    {
        name: "No Matter the Distance",
        subtitle: "Our story isn't finished yet."
    }

];


/* =========================================================
   GET CHAPTER ARRAY
========================================================= */

function getCurrentChapter() {

    const chapterNames = Object.keys(chapters);

    return chapters[chapterNames[currentChapter]];

}


/* =========================================================
   SHOW CHAPTER TITLE
========================================================= */

function showChapterTitle() {

    const info = chapterInfo[currentChapter];

    chapterTitleText.textContent = info.name;

    chapterSubtitle.textContent = info.subtitle;

    chapterTitle.classList.remove("hidden");

    if (chapterTitleTimer) {

        clearTimeout(chapterTitleTimer);

    }

    chapterTitleTimer = setTimeout(() => {

        chapterTitle.classList.add("hidden");

        showDialogue();

    }, 3000);

}


/* =========================================================
   SHOW DIALOGUE
========================================================= */

function showDialogue() {

    const chapter = getCurrentChapter();

    if (currentDialogue >= chapter.length) {

        nextChapter();

        return;

    }

    showingDialogue = true;

    const dialogue = chapter[currentDialogue];

    /*
       IMPORTANT:

       This automatically converts any old speaker
       names such as "Me" or "Her" into the correct
       names.

       So even if an old version of the dialogue
       somehow remains, the box will still display:

       Me  -> Cooper
       Her -> Alyssa
    */

    const speakerNames = {

        "Me": "Cooper",

        "Her": "Alyssa",

        "Cooper": "Cooper",

        "Alyssa": "Alyssa"

    };

    const speakerName =
        speakerNames[dialogue.speaker] ||
        dialogue.speaker;

    speakerElement.textContent = speakerName;

    dialogueTextElement.textContent =
        dialogue.text;

    dialogueBox.classList.remove("hidden");

}


/* =========================================================
   ADVANCE DIALOGUE
========================================================= */

function advanceDialogue() {

    if (!gameStarted) {
        return;
    }

    if (!showingDialogue) {
        return;
    }

    currentDialogue++;

    const chapter = getCurrentChapter();

    if (currentDialogue >= chapter.length) {

        dialogueBox.classList.add("hidden");

        showingDialogue = false;

        nextChapter();

        return;

    }

    showDialogue();

}


/* =========================================================
   NEXT CHAPTER
========================================================= */

function nextChapter() {

    currentChapter++;

    currentDialogue = 0;

    if (currentChapter >= chapterInfo.length) {

        currentChapter = chapterInfo.length - 1;

        dialogueBox.classList.remove("hidden");

        speakerElement.textContent = "Cooper";

        dialogueTextElement.textContent =
            "This is only the beginning of the rest of our story. ❤️";

        return;

    }

    player.x = 120;

    showChapterTitle();

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    gameStarted = true;

    currentChapter = 0;

    currentDialogue = 0;

    player.x = 120;

    titleScreen.classList.add("hidden");

    showChapterTitle();

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {

        keys.left = true;

    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {

        keys.right = true;

    }

    if (
        event.key === " " ||
        event.key === "Enter"
    ) {

        if (gameStarted) {

            event.preventDefault();

            advanceDialogue();

        }

    }

});


document.addEventListener("keyup", function(event) {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {

        keys.left = false;

    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {

        keys.right = false;

    }

});


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    if (!gameStarted) {
        return;
    }

    if (keys.left) {

        player.x -= player.speed;

    }

    if (keys.right) {

        player.x += player.speed;

    }

    if (player.x < 0) {

        player.x = 0;

    }

    if (player.x > canvas.width - player.width) {

        player.x =
            canvas.width - player.width;

    }

}


/* =========================================================
   DRAW SKY
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#87ceeb"
    );

    gradient.addColorStop(
        1,
        "#dff8ff"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   DRAW CLOUDS
========================================================= */

function drawCloud(x, y, scale = 1) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 30 * scale,
        y - 10 * scale,
        32 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 65 * scale,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


function drawClouds() {

    drawCloud(120, 100, 1);

    drawCloud(500, 80, 0.8);

    drawCloud(800, 130, 1.1);

}


/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround() {

    ctx.fillStyle = "#7ec850";

    ctx.fillRect(
        0,
        430,
        canvas.width,
        110
    );

    ctx.fillStyle = "#5fa83b";

    ctx.fillRect(
        0,
        430,
        canvas.width,
        8
    );

}


/* =========================================================
   DRAW SIMPLE HOUSE
========================================================= */

function drawHouse() {

    const x = 650;

    const y = 280;

    /* House */

    ctx.fillStyle = "#f4d6b2";

    ctx.fillRect(
        x,
        y + 70,
        180,
        130
    );


    /* Roof */

    ctx.fillStyle = "#b44b4b";

    ctx.beginPath();

    ctx.moveTo(
        x - 20,
        y + 70
    );

    ctx.lineTo(
        x + 90,
        y
    );

    ctx.lineTo(
        x + 200,
        y + 70
    );

    ctx.closePath();

    ctx.fill();


    /* Door */

    ctx.fillStyle = "#704214";

    ctx.fillRect(
        x + 75,
        y + 120,
        40,
        80
    );


    /* Windows */

    ctx.fillStyle = "#9edfff";

    ctx.fillRect(
        x + 20,
        y + 100,
        40,
        40
    );

    ctx.fillRect(
        x + 125,
        y + 100,
        40,
        40
    );


    /* Window lines */

    ctx.strokeStyle = "#555";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        x + 40,
        y + 100
    );

    ctx.lineTo(
        x + 40,
        y + 140
    );

    ctx.moveTo(
        x + 20,
        y + 120
    );

    ctx.lineTo(
        x + 60,
        y + 120
    );

    ctx.moveTo(
        x + 145,
        y + 100
    );

    ctx.lineTo(
        x + 145,
        y + 140
    );

    ctx.moveTo(
        x + 125,
        y + 120
    );

    ctx.lineTo(
        x + 165,
        y + 120
    );

    ctx.stroke();

}


/* =========================================================
   DRAW TREE
========================================================= */

function drawTree(x, y, scale = 1) {

    /* Trunk */

    ctx.fillStyle = "#7b4a25";

    ctx.fillRect(
        x - 12 * scale,
        y,
        24 * scale,
        90 * scale
    );


    /* Leaves */

    ctx.fillStyle = "#3f9639";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        45 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x - 35 * scale,
        y + 20 * scale,
        35 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 35 * scale,
        y + 20 * scale,
        35 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x = player.x;

    const y = player.y;


    /* Body */

    ctx.fillStyle = "#4b6cb7";

    ctx.fillRect(
        x + 8,
        y + 20,
        24,
        35
    );


    /* Head */

    ctx.fillStyle = "#f2c6a0";

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y + 12,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle = "#4a2c20";

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y + 8,
        13,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Legs */

    ctx.fillStyle = "#333";

    ctx.fillRect(
        x + 9,
        y + 55,
        8,
        12
    );

    ctx.fillRect(
        x + 23,
        y + 55,
        8,
        12
    );

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    drawSky();

    drawClouds();

    drawGround();

    drawTree(
        180,
        340,
        1
    );

    drawTree(
        400,
        350,
        0.8
    );

    drawTree(
        870,
        350,
        0.9
    );

    drawHouse();

    drawPlayer();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    updatePlayer();

    drawWorld();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   START LOOP
========================================================= */

gameLoop();

</script>

</body>
</html>
